<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account – Maathruthva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:#fff8f0;color:#333;min-height:100vh;}

    /* ── Header ── */
    header{background:#fff;border-bottom:1px solid #f0e6d3;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .nav-actions{display:flex;gap:12px;align-items:center;}
    .btn-back{background:none;border:1.5px solid #b5451b;color:#b5451b;padding:7px 18px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;text-decoration:none;}
    .btn-back:hover{background:#b5451b;color:#fff;}
    .logout-btn{background:none;border:1.5px solid #ccc;color:#666;padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:'Jost',sans-serif;}
    .logout-btn:hover{border-color:#b5451b;color:#b5451b;}

    /* ── Page ── */
    .page{max-width:720px;margin:0 auto;padding:32px 20px 60px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:32px;color:#b5451b;margin-bottom:6px;}
    .page-sub{color:#888;font-size:14px;margin-bottom:28px;}

    /* ── States ── */
    .state-box{text-align:center;padding:80px 20px;}
    .state-box svg{width:64px;height:64px;opacity:.25;margin-bottom:16px;}
    .state-box h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:#555;margin-bottom:8px;}
    .state-box p{color:#999;font-size:14px;margin-bottom:20px;}
    .btn-shop{background:#b5451b;color:#fff;border:none;padding:12px 28px;border-radius:24px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;}
    .btn-shop:hover{background:#9a3a17;}

    /* ── Section ── */
    .section-card{background:#fff;border-radius:14px;padding:24px 24px 26px;margin-bottom:22px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:#333;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}

    /* ── Profile ── */
    .profile-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
    .profile-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#b5451b,#e07a5f);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;font-family:'Cormorant Garamond',serif;flex-shrink:0;}
    .profile-name-wrap{flex:1;}
    .profile-name{font-size:18px;font-weight:600;color:#333;}
    .profile-since{font-size:12px;color:#999;margin-top:2px;}
    .profile-field-list{display:flex;flex-direction:column;gap:12px;}
    .profile-field{display:flex;align-items:center;gap:12px;font-size:14px;color:#444;padding:10px 14px;background:#fdf8f2;border-radius:10px;}
    .profile-field-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
    .profile-field-label{color:#999;font-size:11px;text-transform:uppercase;letter-spacing:.5px;min-width:70px;}
    .btn-edit-name{background:none;border:1.5px solid #b5451b;color:#b5451b;padding:5px 14px;border-radius:16px;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;}
    .btn-edit-name:hover{background:#b5451b;color:#fff;}
    .name-edit-row{display:flex;gap:8px;margin-top:6px;}
    .name-edit-input{flex:1;padding:8px 12px;border:1.5px solid #e0d8cc;border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;outline:none;}
    .name-edit-input:focus{border-color:#b5451b;}
    .btn-save-name{background:#b5451b;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;}
    .btn-save-name:hover{background:#9a3a17;}

    /* ── Addresses ── */
    .btn-add-addr{background:#b5451b;color:#fff;border:none;padding:8px 18px;border-radius:18px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;}
    .btn-add-addr:hover{background:#9a3a17;}
    .addr-empty{color:#999;font-size:14px;text-align:center;padding:24px 10px;}
    .addr-card{border:1.5px solid #f0e6d3;border-radius:12px;padding:16px 18px;margin-bottom:12px;position:relative;}
    .addr-card:last-child{margin-bottom:0;}
    .addr-name-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .addr-name{font-weight:600;font-size:14px;color:#333;}
    .addr-type-badge{font-size:11px;background:#f0e6d3;color:#8a6a3a;border-radius:20px;padding:2px 10px;}
    .addr-text{font-size:13px;color:#666;line-height:1.6;}
    .addr-phone{font-size:13px;color:#666;margin-top:4px;}
    .addr-actions{display:flex;gap:10px;margin-top:12px;}
    .addr-edit-btn,.addr-del-btn{background:none;border:1.5px solid #e0d8cc;color:#666;padding:5px 14px;border-radius:16px;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;}
    .addr-edit-btn:hover{border-color:#b5451b;color:#b5451b;}
    .addr-del-btn:hover{border-color:#c0392b;color:#c0392b;}

    /* ── Address form ── */
    .addr-form{border:1.5px solid #f0e6d3;border-radius:12px;padding:18px;margin-top:16px;display:none;}
    .addr-form.open{display:block;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .form-full{grid-column:1/-1;}
    .field label{font-size:12px;color:#888;margin-bottom:5px;display:block;}
    .field input,.field select{width:100%;padding:9px 12px;border:1.5px solid #e0d8cc;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;outline:none;color:#333;background:#fff;}
    .field input:focus,.field select:focus{border-color:#b5451b;}
    .addr-form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
    .btn-cancel-form{background:none;border:1.5px solid #ccc;color:#666;padding:8px 20px;border-radius:18px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;}
    .btn-save-addr{background:#b5451b;color:#fff;border:none;padding:8px 22px;border-radius:18px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;}
    .btn-save-addr:hover{background:#9a3a17;}

    /* ── Loading spinner ── */
    .spinner{width:36px;height:36px;border:3px solid #f0e6d3;border-top-color:#b5451b;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Maathruthva page loader ── */
    #page-loader{position:fixed;inset:0;z-index:9999;background:#F7F2E7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease,visibility .6s ease;}
    #page-loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .loader-emblem-wrap{position:relative;width:120px;height:120px;}
    .loader-emblem{width:120px;height:120px;border-radius:50%;object-fit:contain;background:#FBF8F0;position:relative;z-index:2;animation:loaderPulse 1.8s ease-in-out infinite;}
    .loader-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;background:linear-gradient(white,white) padding-box,linear-gradient(135deg,#6B8C4A,#DCE7C4,#B8901A,#6B8C4A) border-box;animation:loaderSpin 2.4s linear infinite;}
    .loader-ring2{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(107,140,74,.25);animation:loaderSpin 3.6s linear infinite reverse;}
    .loader-shine{position:absolute;inset:0;border-radius:50%;z-index:3;background:conic-gradient(from 0deg,transparent 60%,rgba(255,255,255,.55) 80%,transparent 100%);animation:loaderSpin 1.8s linear infinite;}
    .loader-text{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:500;color:#4A6830;letter-spacing:.04em;animation:loaderFade 1.8s ease-in-out infinite;}
    .loader-dots{display:inline-flex;gap:4px;margin-left:2px;vertical-align:bottom;}
    .loader-dots span{width:5px;height:5px;border-radius:50%;background:#B8901A;animation:dotBounce 1.4s ease-in-out infinite;}
    .loader-dots span:nth-child(2){animation-delay:.2s;}
    .loader-dots span:nth-child(3){animation-delay:.4s;}
    .loader-tagline{font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#8A7A50;}
    @keyframes loaderPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(107,140,74,.25);}50%{transform:scale(1.04);box-shadow:0 0 0 14px rgba(107,140,74,0);}}
    @keyframes loaderSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes loaderFade{0%,100%{opacity:.6;}50%{opacity:1;}}
    @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-6px);opacity:1;}}
    @media(max-width:560px){.loader-emblem-wrap{width:96px;height:96px;}.loader-emblem{width:96px;height:96px;}.loader-text{font-size:1.3rem;}}

    .brand-lockup{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .brand-logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#FBF8F0;padding:2px;box-shadow:0 3px 10px -3px rgba(74,104,48,.45);flex-shrink:0;}
    .brand-wordmark{height:32px;width:auto;object-fit:contain;}

    @media(max-width:480px){
      .form-grid{grid-template-columns:1fr;}
      .section-card{padding:20px 16px 22px;}
      .page{padding:24px 14px 60px;}
    }
  </style>
<script src="product-catalog.js"></script>
</head>
<body>

<!-- Maathruthva Page Loader -->
<div id="page-loader">
  <div class="loader-emblem-wrap">
    <div class="loader-ring"></div>
    <div class="loader-ring2"></div>
    <img class="loader-emblem" id="loader-emblem-img" src="" alt="Maathruthva">
    <div class="loader-shine"></div>
  </div>
  <div class="loader-text">Maathruthva<span class="loader-dots"><span></span><span></span><span></span></span></div>
  <div class="loader-tagline">Products of Mother Nature</div>
</div>
<script>
  (function(){
    var _t = setInterval(function(){
      var src = document.querySelector('img.brand-logo');
      if(src && src.src){ document.getElementById('loader-emblem-img').src = src.src; clearInterval(_t); }
    }, 50);
    setTimeout(function(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }, 3000);
  })();
</script>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <a class="brand-lockup" href="index.html">
        <img class="brand-logo" src="assets/img/c05170bd02.webp" alt="Maathruthva logo">
        <img class="brand-wordmark" src="assets/img/3b99c164f9.webp" alt="Maathruthva — Products of Mother Nature">
    </a>
  </div>
  <div class="nav-actions">
    <button class="logout-btn" id="logout-btn" onclick="doLogout()" style="display:none;">Log Out</button>
    <a class="btn-back" href="Food_Products.html">← Shop</a>
  </div>
</header>

<div class="page">
  <h1 class="page-title">My Account</h1>
  <p class="page-sub" id="account-sub">Loading your account…</p>
  <div id="account-container"><div class="spinner"></div></div>
</div>

<script type="module">
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, deleteDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBWhNCWiT-us4L_J5ihcCiniisX1Jy9SoU",
    authDomain: "maathruthva.firebaseapp.com",
    projectId: "maathruthva",
    storageBucket: "maathruthva.firebasestorage.app",
    messagingSenderId: "772318181453",
    appId: "1:772318181453:web:e736b87f53c264b8cf8404"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  const container = document.getElementById('account-container');
  const sub = document.getElementById('account-sub');
  let addresses = [];
  let editingFirestoreId = null;

  window.doLogout = function(){
    localStorage.removeItem('mtr_user');
    localStorage.removeItem('mtr_addresses');
    signOut(auth).catch(()=>{});
    location.href = 'login.html';
  };

  onAuthStateChanged(auth, (firebaseUser) => {
    const stored = JSON.parse(localStorage.getItem('mtr_user') || 'null');
    if (!firebaseUser && stored && stored.loggedIn && !stored.guest) {
      localStorage.removeItem('mtr_user');
      localStorage.removeItem('mtr_addresses');
      location.href = 'login.html?next=my-account.html';
      return;
    }
    loadAccount();
  });

  function hideLoader(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }

  function getInitials(name) {
    return String(name||'?').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  }

  async function loadAccount() {
    const user = JSON.parse(localStorage.getItem('mtr_user') || 'null');
    if (!user || !user.uid || user.guest) {
      container.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 11c0 2.21-1.79 4-4 4s-4-1.79-4-4 1.79-4 4-4 4 1.79 4 4zm6 8c0-3.31-4.03-6-9-6s-9 2.69-9 6"/></svg>
          <h3>Please log in</h3>
          <p>You need to be logged in to view your account.</p>
          <button class="btn-shop" onclick="location.href='login.html?next=my-account.html'">Log In</button>
        </div>`;
      sub.textContent = '';
      hideLoader();
      return;
    }

    document.getElementById('logout-btn').style.display = '';
    sub.textContent = 'Manage your details and delivery addresses';

    // Prefer freshest name/phone from Firestore users/{uid}, fall back to localStorage
    let profile = { name: user.name || '', phone: user.phone || '', email: user.email || '' };
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        const d = snap.data();
        if (d.name) profile.name = d.name;
        if (d.phone) profile.phone = d.phone;
      }
    } catch(e) { console.error('Fetch profile error:', e); }
    // Google sign-in without a phone number stores the email into the "phone" field as a fallback — move it to email instead
    if (profile.phone && profile.phone.includes('@')) {
      if (!profile.email) profile.email = profile.phone;
      profile.phone = '';
    }

    try {
      const addrSnap = await getDocs(collection(db, 'users', user.uid, 'addresses'));
      addresses = addrSnap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
    } catch(e) { console.error('Fetch addresses error:', e); addresses = []; }

    container.innerHTML = `
      <div class="section-card">
        <div class="section-title">Profile</div>
        <div class="profile-row">
          <div class="profile-avatar">${getInitials(profile.name)}</div>
          <div class="profile-name-wrap">
            <div class="profile-name" id="profile-name-display">${escapeHtml(profile.name) || 'Your Name'}</div>
            <div class="profile-since">Member of Maathruthva</div>
          </div>
          <button class="btn-edit-name" onclick="toggleNameEdit()">✏️ Edit</button>
        </div>
        <div class="name-edit-row" id="name-edit-row" style="display:none;">
          <input class="name-edit-input" id="name-edit-input" type="text" value="${escapeHtml(profile.name)}" placeholder="Full name">
          <button class="btn-save-name" onclick="saveName('${user.uid}')">Save</button>
        </div>
        <div class="profile-field-list" style="margin-top:16px;">
          ${profile.phone ? `<div class="profile-field"><span class="profile-field-icon">📱</span><span class="profile-field-label">Mobile</span><span>${escapeHtml(profile.phone)}</span></div>` : ''}
          ${profile.email ? `<div class="profile-field"><span class="profile-field-icon">✉️</span><span class="profile-field-label">Email</span><span>${escapeHtml(profile.email)}</span></div>` : ''}
        </div>
      </div>

      <div class="section-card">
        <div class="section-title">Saved Addresses <button class="btn-add-addr" onclick="openAddrForm()">+ Add Address</button></div>
        <div id="addr-list"></div>
        <div class="addr-form" id="addr-form">
          <div class="form-grid">
            <div class="field form-full"><label>Full Name *</label><input type="text" id="f-name" placeholder="Enter full name"></div>
            <div class="field"><label>Mobile *</label><input type="tel" id="f-phone" placeholder="10-digit mobile" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="field"><label>Pincode *</label><input type="text" id="f-pin" placeholder="6-digit pincode" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="field form-full"><label>Address Line 1 *</label><input type="text" id="f-addr1" placeholder="House / Flat / Building no."></div>
            <div class="field form-full"><label>Address Line 2</label><input type="text" id="f-addr2" placeholder="Area / Street / Locality (optional)"></div>
            <div class="field"><label>City *</label><input type="text" id="f-city" placeholder="City"></div>
            <div class="field"><label>State *</label>
              <select id="f-state">
                <option value="">Select state</option>
                <option>Andhra Pradesh</option><option>Telangana</option><option>Tamil Nadu</option>
                <option>Karnataka</option><option>Kerala</option><option>Maharashtra</option>
                <option>Delhi</option><option>Uttar Pradesh</option><option>Gujarat</option>
                <option>Rajasthan</option><option>West Bengal</option><option>Other</option>
              </select>
            </div>
            <div class="field"><label>Address Type</label>
              <select id="f-type"><option value="Home">Home</option><option value="Work">Work</option><option value="Other">Other</option></select>
            </div>
          </div>
          <div class="addr-form-actions">
            <button class="btn-cancel-form" onclick="closeAddrForm()">Cancel</button>
            <button class="btn-save-addr" onclick="saveAddr('${user.uid}')">Save Address</button>
          </div>
        </div>
      </div>`;

    renderAddresses();
    hideLoader();
  }

  window.toggleNameEdit = function(){
    const row = document.getElementById('name-edit-row');
    row.style.display = row.style.display === 'none' ? 'flex' : 'none';
  };

  window.saveName = async function(uid){
    const name = document.getElementById('name-edit-input').value.trim();
    if(!name) return;
    try {
      await setDoc(doc(db, 'users', uid), { name, updatedAt: serverTimestamp() }, { merge: true });
      const stored = JSON.parse(localStorage.getItem('mtr_user') || '{}');
      stored.name = name;
      localStorage.setItem('mtr_user', JSON.stringify(stored));
      document.getElementById('profile-name-display').textContent = name;
      document.getElementById('name-edit-row').style.display = 'none';
    } catch(e) { console.error('Save name error:', e); }
  };

  function renderAddresses(){
    const list = document.getElementById('addr-list');
    if (!addresses.length) {
      list.innerHTML = '<div class="addr-empty">No saved addresses yet. Add one to speed up checkout.</div>';
      return;
    }
    list.innerHTML = addresses.map(a => `
      <div class="addr-card">
        <div class="addr-name-row">
          <span class="addr-name">${escapeHtml(a.name)}</span>
          <span class="addr-type-badge">${escapeHtml(a.type || 'Home')}</span>
        </div>
        <div class="addr-text">${escapeHtml(a.addr1)}${a.addr2 ? ', ' + escapeHtml(a.addr2) : ''}</div>
        <div class="addr-text">${escapeHtml(a.city)}, ${escapeHtml(a.state)} — ${escapeHtml(a.pin)}</div>
        <div class="addr-phone">📱 ${escapeHtml(a.phone)}</div>
        <div class="addr-actions">
          <button class="addr-edit-btn" onclick="editAddr('${a.firestoreId}')">✏️ Edit</button>
          <button class="addr-del-btn" onclick="deleteAddr('${a.firestoreId}')">🗑️ Delete</button>
        </div>
      </div>`).join('');
  }

  window.openAddrForm = function(){
    editingFirestoreId = null;
    ['f-name','f-phone','f-pin','f-addr1','f-addr2','f-city'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-state').value = '';
    document.getElementById('f-type').value = 'Home';
    document.getElementById('addr-form').classList.add('open');
    document.getElementById('f-name').focus();
  };

  window.closeAddrForm = function(){
    document.getElementById('addr-form').classList.remove('open');
    editingFirestoreId = null;
  };

  window.editAddr = function(firestoreId){
    const a = addresses.find(x => x.firestoreId === firestoreId);
    if (!a) return;
    editingFirestoreId = firestoreId;
    document.getElementById('f-name').value = a.name || '';
    document.getElementById('f-phone').value = a.phone || '';
    document.getElementById('f-pin').value = a.pin || '';
    document.getElementById('f-addr1').value = a.addr1 || '';
    document.getElementById('f-addr2').value = a.addr2 || '';
    document.getElementById('f-city').value = a.city || '';
    document.getElementById('f-state').value = a.state || '';
    document.getElementById('f-type').value = a.type || 'Home';
    document.getElementById('addr-form').classList.add('open');
    document.getElementById('f-name').focus();
  };

  window.saveAddr = async function(uid){
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const pin = document.getElementById('f-pin').value.trim();
    const addr1 = document.getElementById('f-addr1').value.trim();
    const addr2 = document.getElementById('f-addr2').value.trim();
    const city = document.getElementById('f-city').value.trim();
    const state = document.getElementById('f-state').value;
    const type = document.getElementById('f-type').value;

    if (!name || !phone || !pin || !addr1 || !city || !state) { alert('Please fill all required fields (*)'); return; }
    if (!/^[1-9]\d{5}$/.test(pin)) { alert('Enter a valid 6-digit Indian pincode'); return; }
    if (!/^[6-9]\d{9}$/.test(phone)) { alert('Enter a valid 10-digit mobile number'); return; }

    const addrData = { name, phone, pin, addr1, addr2, city, state, type };
    try {
      if (editingFirestoreId) {
        await updateDoc(doc(db, 'users', uid, 'addresses', editingFirestoreId), { ...addrData, updatedAt: serverTimestamp() });
        const idx = addresses.findIndex(a => a.firestoreId === editingFirestoreId);
        if (idx > -1) addresses[idx] = { firestoreId: editingFirestoreId, ...addrData };
      } else {
        const ref = await addDoc(collection(db, 'users', uid, 'addresses'), { ...addrData, createdAt: serverTimestamp() });
        addresses.push({ firestoreId: ref.id, ...addrData });
      }
      localStorage.setItem('mtr_addresses', JSON.stringify(addresses));
      closeAddrForm();
      renderAddresses();
    } catch(e) { console.error('Save address error:', e); alert('Could not save address. Please try again.'); }
  };

  window.deleteAddr = async function(firestoreId){
    if (!confirm('Delete this address?')) return;
    try {
      const user = JSON.parse(localStorage.getItem('mtr_user') || 'null');
      await deleteDoc(doc(db, 'users', user.uid, 'addresses', firestoreId));
      addresses = addresses.filter(a => a.firestoreId !== firestoreId);
      localStorage.setItem('mtr_addresses', JSON.stringify(addresses));
      renderAddresses();
    } catch(e) { console.error('Delete address error:', e); alert('Could not delete address. Please try again.'); }
  };
</script>

</body>
</html>
