<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Orders Dashboard | Maathruthva</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:#f5f0e8;color:#333;min-height:100vh;}

    /* ── PIN Gate ── */
    #pin-gate{position:fixed;inset:0;background:#f5f0e8;display:flex;align-items:center;justify-content:center;z-index:999;}
    .pin-box{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.1);}
    .pin-logo{font-family:'Cormorant Garamond',serif;font-size:28px;color:#b5451b;font-weight:600;margin-bottom:4px;}
    .pin-sub{font-size:13px;color:#888;margin-bottom:28px;}
    .pin-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;text-align:left;}
    .pin-input{width:100%;padding:12px 16px;border:1.5px solid #e0d8cc;border-radius:10px;font-size:18px;letter-spacing:6px;text-align:center;font-family:'Jost',sans-serif;outline:none;margin-bottom:16px;}
    .pin-input:focus{border-color:#b5451b;}
    .pin-btn{width:100%;padding:13px;background:#b5451b;color:#fff;border:none;border-radius:10px;font-family:'Jost',sans-serif;font-size:15px;font-weight:500;cursor:pointer;}
    .pin-btn:hover{background:#9a3a17;}
    .pin-error{color:#c0392b;font-size:13px;margin-top:10px;display:none;}

    /* ── Header ── */
    header{background:#fff;border-bottom:1px solid #e8dfd0;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .admin-brand{display:flex;align-items:center;gap:12px;}
    .brand-logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#FBF8F0;padding:2px;box-shadow:0 3px 10px -3px rgba(74,104,48,.45);flex-shrink:0;}
    .brand-wordmark{height:34px;width:auto;max-width:160px;object-fit:contain;}
    .admin-badge{font-size:11px;background:#fff3cd;color:#856404;padding:3px 10px;border-radius:20px;font-weight:500;border:1px solid #ffc107;}
    .logout-btn{background:none;border:1.5px solid #ccc;color:#666;padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:'Jost',sans-serif;}
    .logout-btn:hover{border-color:#b5451b;color:#b5451b;}

    /* ── Main ── */
    .main{max-width:1100px;margin:0 auto;padding:28px 24px 60px;}

    /* ── Controls ── */
    .controls{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
    .date-picker-wrap{display:flex;align-items:center;gap:10px;}
    .filter-mode-toggle{display:flex;gap:4px;background:#f0e6d3;border-radius:10px;padding:3px;}
    .filter-mode-btn{padding:6px 14px;border:none;border-radius:8px;background:transparent;color:#888;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;}
    .filter-mode-btn.active{background:#fff;color:#b5451b;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1);}
    .month-input,.year-input{padding:9px 14px;border:1.5px solid #e0d8cc;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;color:#333;background:#fff;outline:none;}
    .month-input:focus,.year-input:focus{border-color:#b5451b;}
    .year-input{width:100px;}
    .date-picker-wrap label{font-size:13px;color:#888;font-weight:500;}
    .date-input{padding:9px 14px;border:1.5px solid #e0d8cc;border-radius:10px;font-family:'Jost',sans-serif;font-size:14px;color:#333;background:#fff;cursor:pointer;outline:none;}
    .date-input:focus{border-color:#b5451b;}
    .refresh-btn{padding:9px 18px;background:#fff;border:1.5px solid #e0d8cc;border-radius:10px;font-family:'Jost',sans-serif;font-size:13px;color:#555;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .refresh-btn:hover{border-color:#b5451b;color:#b5451b;}

    /* ── Stats ── */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
    .stat-card{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid #ede6da;}
    .stat-val{font-size:28px;font-weight:600;color:#333;margin-bottom:4px;}
    .stat-val.revenue{color:#b5451b;}
    .stat-label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.06em;}
    .stat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
    .dot-pending{background:#f39c12;}
    .dot-dispatched{background:#27ae60;}
    .dot-delivered{background:#6f42c1;}

    /* ── Filter tabs ── */
    .filter-tabs{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
    .tab{padding:7px 18px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid #e0d8cc;background:#fff;color:#666;font-family:'Jost',sans-serif;transition:.2s;}
    .tab.active{background:#b5451b;border-color:#b5451b;color:#fff;}
    .tab-count{display:inline-block;background:rgba(255,255,255,.3);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;}
    .tab:not(.active) .tab-count{background:#f0e6d3;color:#b5451b;}
    .search-wrap{margin-left:auto;position:relative;display:flex;align-items:center;}
    .search-input{padding:7px 16px 7px 36px;border:1.5px solid #e0d8cc;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;color:#333;background:#fff;outline:none;width:240px;transition:.2s;}
    .search-input:focus{border-color:#b5451b;width:280px;}
    .search-input::placeholder{color:#bbb;}
    .search-icon{position:absolute;left:12px;color:#bbb;font-size:14px;pointer-events:none;}
    .search-clear{position:absolute;right:10px;color:#bbb;font-size:16px;cursor:pointer;display:none;line-height:1;}
    .search-clear:hover{color:#b5451b;}
    @media(max-width:768px){.search-wrap{margin-left:0;width:100%;}.search-input{width:100%;}.search-input:focus{width:100%;}}

    /* ── Order cards ── */
    .orders-grid{display:flex;flex-direction:column;gap:14px;}
    .order-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ede6da;transition:box-shadow .2s;}
    .order-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
    .order-card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#fdf8f2;border-bottom:1px solid #f0e6d3;flex-wrap:wrap;gap:10px;}
    .order-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .order-time{font-size:12px;color:#888;}
    .order-pid{font-size:12px;color:#b5451b;background:#ffeee7;padding:3px 10px;border-radius:10px;font-weight:500;font-family:monospace;}
    .order-total{font-size:16px;font-weight:600;color:#333;}

    /* Status badge */
    .status-badge{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500;white-space:nowrap;}
    .status-confirmed{background:#fff3cd;color:#856404;}
    .status-dispatched{background:#d4edda;color:#155724;}
    .status-delivered{background:#e8d5f5;color:#4a235a;}
    .status-cancelled{background:#f8d7da;color:#721c24;}

    /* Status buttons */
    .status-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .btn-status{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid;font-family:'Jost',sans-serif;transition:.2s;white-space:nowrap;}
    .btn-dispatch{border-color:#27ae60;color:#27ae60;background:#fff;}
    .btn-dispatch:hover{background:#27ae60;color:#fff;}
    .btn-deliver{border-color:#6f42c1;color:#6f42c1;background:#fff;}
    .btn-deliver:hover{background:#6f42c1;color:#fff;}
    .btn-delivered-done{border-color:#aaa;color:#aaa;background:#f9f9f9;cursor:default;}

    /* Order body */
    .order-card-body{display:grid;grid-template-columns:1fr 1fr;gap:0;}
    .order-items-col{padding:16px 20px;border-right:1px solid #f0e6d3;}
    .order-addr-col{padding:16px 20px;}
    .col-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:10px;font-weight:500;}
    .item-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #faf5ee;font-size:13px;}
    .item-row:last-child{border-bottom:none;}
    .item-name{color:#444;flex:1;}
    .item-qty{color:#888;margin:0 12px;font-size:12px;}
    .item-price{color:#b5451b;font-weight:500;}
    .addr-line{font-size:13px;color:#555;line-height:1.7;}
    .addr-name{font-weight:500;color:#333;font-size:14px;margin-bottom:4px;}
    .addr-phone{font-size:13px;color:#888;margin-top:4px;}
    .customer-email{font-size:12px;color:#aaa;margin-top:2px;}

    /* Empty state */
    .empty-state{text-align:center;padding:80px 20px;}
    .empty-state h3{font-family:'Cormorant Garamond',serif;font-size:26px;color:#888;margin-bottom:8px;}
    .empty-state p{color:#aaa;font-size:14px;}

    /* Loading */
    .spinner{width:36px;height:36px;border:3px solid #f0e6d3;border-top-color:#b5451b;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* Error */
    .error-box{background:#fff3f3;border:1px solid #f5c6cb;border-radius:12px;padding:20px;color:#721c24;font-size:14px;margin:20px 0;}

    /* ── Revenue breakdown ── */
    .rev-breakdown-card{background:#fff;border-radius:14px;border:1px solid #ede6da;overflow:hidden;}
    .rev-breakdown-title{padding:16px 20px;font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #f0e6d3;}
    .rev-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #faf5ee;font-size:14px;}
    .rev-row:last-child{border-bottom:none;}
    .rev-row-label{color:#444;}
    .rev-row-count{color:#aaa;font-size:12px;margin-left:8px;}
    .rev-row-amt{color:#b5451b;font-weight:600;}
    .rev-bar-wrap{flex:1;margin:0 16px;background:#f4efe6;border-radius:6px;height:8px;overflow:hidden;}
    .rev-bar{height:100%;background:linear-gradient(90deg,#e2a37a,#b5451b);border-radius:6px;}
    .rev-bar.units{background:linear-gradient(90deg,#a8c98a,#4a6830);}
    .rev-bar.rating{background:linear-gradient(90deg,#f7c873,#f5a623);}
    .perf-chart{margin-bottom:24px;background:#fff;border-radius:14px;border:1px solid #ede6da;padding:20px 24px 16px;}
    .perf-chart-title{font-size:15px;font-weight:600;color:#333;margin-bottom:18px;}
    .vbar-chart{display:flex;align-items:flex-end;gap:14px;height:200px;padding:0 4px;overflow-x:auto;}
    .vbar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:54px;flex:1;}
    .vbar-val{font-size:12px;font-weight:600;color:#333;margin-bottom:6px;white-space:nowrap;}
    .vbar-track{width:34px;flex:1;display:flex;align-items:flex-end;background:#f4efe6;border-radius:8px 8px 0 0;overflow:hidden;}
    .vbar-fill{width:100%;border-radius:8px 8px 0 0;transition:height .3s;}
    .vbar-fill.revenue{background:linear-gradient(180deg,#e2a37a,#b5451b);}
    .vbar-fill.units{background:linear-gradient(180deg,#a8c98a,#4a6830);}
    .vbar-fill.rating{background:linear-gradient(180deg,#f7c873,#f5a623);}
    .vbar-label{font-size:11px;color:#888;margin-top:8px;text-align:center;white-space:nowrap;}

    /* ── Merged performance chart ── */
    .merged-legend{display:flex;gap:18px;margin-bottom:16px;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;}
    .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
    .legend-dot.revenue{background:linear-gradient(135deg,#e2a37a,#b5451b);}
    .legend-dot.units{background:linear-gradient(135deg,#a8c98a,#4a6830);}
    .legend-dot.rating{background:linear-gradient(135deg,#f7c873,#f5a623);}
    .merged-chart{display:flex;align-items:flex-end;gap:22px;height:210px;padding:0 4px;overflow-x:auto;}
    .merged-month-group{display:flex;flex-direction:column;align-items:center;height:100%;min-width:96px;flex-shrink:0;}
    .merged-bars-row{display:flex;align-items:flex-end;gap:5px;height:170px;flex:1;}
    .merged-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
    .merged-bar-val{font-size:10px;font-weight:600;color:#333;margin-bottom:4px;white-space:nowrap;}
    .merged-bar-track{width:20px;flex:1;display:flex;align-items:flex-end;background:#f4efe6;border-radius:5px 5px 0 0;overflow:hidden;}
    .merged-bar-fill{width:100%;border-radius:5px 5px 0 0;}
    .merged-bar-fill.revenue{background:linear-gradient(180deg,#e2a37a,#b5451b);}
    .merged-bar-fill.units{background:linear-gradient(180deg,#a8c98a,#4a6830);}
    .merged-bar-fill.rating{background:linear-gradient(180deg,#f7c873,#f5a623);}
    .merged-month-label{font-size:11px;color:#888;margin-top:8px;white-space:nowrap;font-weight:600;}
    .merged-month-summary{margin-top:8px;text-align:center;}
    .merged-summary-line{font-size:10px;color:#666;white-space:nowrap;line-height:1.6;}
    .merged-summary-line b{color:#333;font-weight:600;}
    .vbar-sub{font-size:10px;color:#bbb;display:block;}
    .perf-total{margin-top:18px;padding-top:16px;border-top:1px solid #f0e6d3;display:flex;align-items:center;justify-content:space-between;}
    .perf-total-label{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
    .perf-total-val{font-size:20px;font-weight:700;}
    .perf-total-val.revenue{color:#b5451b;}
    .perf-total-val.units{color:#4a6830;}
    .perf-total-val.rating{color:#f5a623;}

    @media(max-width:768px){
      .stats{grid-template-columns:1fr 1fr;}
      .order-card-body{grid-template-columns:1fr;}
      .order-items-col{border-right:none;border-bottom:1px solid #f0e6d3;}
      .controls{flex-direction:column;align-items:flex-start;}
      .main{padding:20px 16px 60px;}
    }
    @media(max-width:480px){
      .stats{grid-template-columns:1fr 1fr;}
      .order-card-head{flex-direction:column;align-items:flex-start;}
    }

    /* ── Section tabs (Orders / Queries) ── */
    .section-tabs{display:flex;gap:8px;margin-bottom:24px;}
    .section-tab{padding:9px 22px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid #e0d8cc;background:#fff;color:#666;font-family:'Jost',sans-serif;transition:.2s;}
    .section-tab.active{background:#333;border-color:#333;color:#fff;}

    /* ── Query cards ── */
    .queries-grid{display:flex;flex-direction:column;gap:14px;}
    .query-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ede6da;padding:16px 20px;transition:box-shadow .2s;}
    .query-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
    .query-card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
    .query-name{font-size:15px;font-weight:600;color:#333;}
    .query-time{font-size:12px;color:#888;}
    .query-contact{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#666;margin-bottom:10px;}
    .query-message{font-size:14px;color:#444;line-height:1.6;background:#fdf8f2;border-radius:10px;padding:12px 14px;}
    .query-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;background:#fff3cd;color:#856404;}
    .query-badge.resolved{background:#d4edda;color:#155724;}
    .query-resolution-wrap{margin-top:12px;padding-top:12px;border-top:1px solid #f0e6d3;}
    .query-resolution-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:8px;font-weight:500;}
    .query-resolution-input{width:100%;padding:9px 12px;border:1.5px solid #e0d8cc;border-radius:10px;font-family:'Jost',sans-serif;font-size:13px;color:#333;resize:vertical;outline:none;}
    .query-resolution-input:focus{border-color:#b5451b;}
    .query-resolution-row{display:flex;justify-content:flex-end;margin-top:8px;}
    .btn-resolve{background:#b5451b;color:#fff;border:none;padding:7px 18px;border-radius:20px;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;}
    .btn-resolve:hover{background:#9a3a17;}
    .btn-resolve:disabled{background:#ccc;cursor:not-allowed;}
    .query-resolution-text{font-size:13px;color:#444;background:#f4f9f4;border-radius:10px;padding:10px 14px;line-height:1.5;}

    /* ── Review cards ── */
    .review-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ede6da;padding:16px 20px;transition:box-shadow .2s;}
    .review-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
    .review-card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
    .review-product{font-size:15px;font-weight:600;color:#333;}
    .review-order-id{font-size:12px;color:#b5451b;background:#ffeee7;padding:3px 10px;border-radius:10px;font-weight:500;font-family:monospace;margin-left:8px;}
    .review-time{font-size:12px;color:#888;}
    .review-stars{color:#f5a623;font-size:18px;margin-bottom:8px;}
    .review-stars .star-empty{color:#ddd;}
    .review-contact{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#666;margin-bottom:10px;}
    .review-comment{font-size:14px;color:#444;line-height:1.6;background:#fdf8f2;border-radius:10px;padding:12px 14px;font-style:italic;}
  </style>
<script src="product-catalog.js"></script>
</head>
<body>

<!-- PIN Gate -->
<div id="pin-gate">
  <div class="pin-box">
    <div class="pin-logo">Maathruthva</div>
    <div class="pin-sub">Admin Orders Dashboard</div>
    <div class="pin-label">Enter Admin PIN</div>
    <input class="pin-input" id="pin-input" type="password" maxlength="6" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="pin-btn" onclick="checkPin()">Access Dashboard</button>
    <div class="pin-error" id="pin-error">Incorrect PIN. Try again.</div>
  </div>
</div>

<!-- Header -->
<header id="admin-header" style="display:none;">
  <div class="admin-brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img class="brand-logo" src="" id="admin-logo-img" alt="Maathruthva">
      <img class="brand-wordmark" src="" id="admin-wordmark-img" alt="Maathruthva">
    </a>
    <span class="admin-badge">Admin</span>
  </div>
  <button class="logout-btn" onclick="lockAdmin()">Lock</button>
</header>

<!-- Main -->
<div class="main" id="admin-main" style="display:none;">

  <!-- Section tabs -->
  <div class="section-tabs">
    <button class="section-tab active" data-section="orders" onclick="adminSetSection('orders')">Orders</button>
    <button class="section-tab" data-section="queries" onclick="adminSetSection('queries')">Queries</button>
    <button class="section-tab" data-section="reviews" onclick="adminSetSection('reviews')">Reviews</button>
    <button class="section-tab" data-section="revenue" onclick="adminSetSection('revenue')">Revenue</button>
    <button class="section-tab" data-section="performance" onclick="adminSetSection('performance')">Product Performance</button>
  </div>

  <!-- Orders section -->
  <div id="orders-section">

  <!-- Controls -->
  <div class="controls">
    <div class="filter-mode-toggle">
      <button class="filter-mode-btn active" data-mode="day" onclick="adminSetOrdersFilterMode('day')">Day</button>
      <button class="filter-mode-btn" data-mode="month" onclick="adminSetOrdersFilterMode('month')">Month</button>
      <button class="filter-mode-btn" data-mode="year" onclick="adminSetOrdersFilterMode('year')">Year</button>
    </div>
    <div class="date-picker-wrap" id="orders-day-picker-wrap">
      <label>Orders for</label>
      <input type="date" class="date-input" id="date-picker">
    </div>
    <div class="date-picker-wrap" id="orders-month-picker-wrap" style="display:none;">
      <label>Orders for</label>
      <input type="month" class="month-input" id="month-picker">
    </div>
    <div class="date-picker-wrap" id="orders-year-picker-wrap" style="display:none;">
      <label>Orders for</label>
      <input type="number" class="year-input" id="year-picker" placeholder="YYYY" min="2020" max="2100">
    </div>
    <button class="refresh-btn" onclick="adminLoadOrders()">↻ Refresh</button>
    <span id="last-updated" style="font-size:12px;color:#aaa;"></span>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="stat-total">—</div>
      <div class="stat-label">Total Orders</div>
    </div>
    <div class="stat-card">
      <div class="stat-val revenue" id="stat-revenue">—</div>
      <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-pending">—</div>
      <div class="stat-label"><span class="stat-dot dot-pending"></span>Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-delivered">—</div>
      <div class="stat-label"><span class="stat-dot dot-delivered"></span>Delivered</div>
    </div>
  </div>

<script type="module">
/* v3 */
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, collectionGroup, query, where, getDocs, getDoc, doc, updateDoc, orderBy, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBWhNCWiT-us4L_J5ihcCiniisX1Jy9SoU",
  authDomain: "maathruthva.firebaseapp.com",
  projectId: "maathruthva",
  storageBucket: "maathruthva.firebasestorage.app",
  messagingSenderId: "772318181453",
  appId: "1:772318181453:web:e736b87f53c264b8cf8404"
};

const ADMIN_PIN = '2611';
const BACKEND_URL = 'https://maathruthva-backend.vercel.app';
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);

let allOrders = [];
let currentFilter = 'all';
let searchQuery = '';
let allQueries = [];
let queriesLoaded = false;
let queriesDateFilter = '';
let allReviews = [];
let reviewsLoaded = false;
let reviewsSearchQuery = '';
let revenueLoaded = false;
let revenueFilterMode = 'day';
let allOrdersFull = [];
let allOrdersFullLoaded = false;
let performanceProduct = '';

// ── All functions defined first ──

function showAdminUI() {
  document.getElementById('pin-gate').style.display = 'none';
  document.getElementById('admin-header').style.display = 'flex';
  document.getElementById('admin-main').style.display = 'block';
}

let ordersFilterMode = 'day';

function initDashboard() {
  const istDate = new Date(Date.now() + 5.5 * 60 * 60000);
  const today = istDate.toISOString().slice(0, 10);
  document.getElementById('date-picker').value = today;
  document.getElementById('month-picker').value = today.slice(0, 7);
  document.getElementById('year-picker').value = today.slice(0, 4);
  document.getElementById('date-picker').addEventListener('change', loadOrders);
  document.getElementById('month-picker').addEventListener('change', loadOrders);
  document.getElementById('year-picker').addEventListener('change', loadOrders);
  loadOrders();
}

function setOrdersFilterMode(mode) {
  ordersFilterMode = mode;
  document.querySelectorAll('#orders-section .filter-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('orders-day-picker-wrap').style.display = mode === 'day' ? 'flex' : 'none';
  document.getElementById('orders-month-picker-wrap').style.display = mode === 'month' ? 'flex' : 'none';
  document.getElementById('orders-year-picker-wrap').style.display = mode === 'year' ? 'flex' : 'none';
  loadOrders();
}

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

async function loadOrders() {
  const grid = document.getElementById('orders-grid');
  grid.innerHTML = '<div class="spinner"></div>';

  let startDate, endDate;
  if (ordersFilterMode === 'day') {
    const date = document.getElementById('date-picker').value;
    if (!date) return;
    startDate = endDate = date;
  } else if (ordersFilterMode === 'month') {
    const month = document.getElementById('month-picker').value; // YYYY-MM
    if (!month) return;
    const [y, m] = month.split('-').map(Number);
    startDate = `${month}-01`;
    endDate = `${month}-${String(daysInMonth(y, m)).padStart(2, '0')}`;
  } else {
    const year = document.getElementById('year-picker').value;
    if (!year) return;
    startDate = `${year}-01-01`;
    endDate = `${year}-12-31`;
  }

  try {
    const q = (ordersFilterMode === 'day')
      ? query(collection(db, 'all_orders'), where('date', '==', startDate), orderBy('createdAt', 'desc'))
      : query(collection(db, 'all_orders'), where('date', '>=', startDate), where('date', '<=', endDate), orderBy('date', 'desc'));
    const snap = await getDocs(q);
    allOrders = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    if (ordersFilterMode !== 'day') {
      allOrders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    }
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    updateStats();
    renderOrders();
  } catch (e) {
    const indexUrl = e.message.match(/https:\/\/\S+/)?.[0] || '';
    const indexLink = indexUrl ? `<br><br><a href="${indexUrl}" target="_blank" style="color:#b5451b;font-weight:500;">→ Click here to create the required Firestore index</a> (takes ~1 min)` : '';
    grid.innerHTML = `<div class="error-box">Error loading orders: ${e.message.split('You can create')[0].trim()}<br><small>Make sure Firestore security rules allow reading <code>all_orders</code>.</small>${indexLink}</div>`;
  }
}

function updateStats() {
  const total = allOrders.length;
  const revenue = allOrders.reduce((s, o) => s + (o.total || 0), 0);
  const pending = allOrders.filter(o => o.status === 'confirmed').length;
  const dispatched = allOrders.filter(o => o.status === 'dispatched').length;
  const delivered = allOrders.filter(o => o.status === 'delivered').length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-revenue').textContent = '₹' + revenue.toFixed(0);
  document.getElementById('stat-pending').textContent = pending + dispatched;
  document.getElementById('stat-delivered').textContent = delivered;

  document.getElementById('cnt-all').textContent = total;
  document.getElementById('cnt-confirmed').textContent = pending;
  document.getElementById('cnt-dispatched').textContent = dispatched;
  document.getElementById('cnt-delivered').textContent = delivered;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  // Clear search when switching tabs
  searchQuery = '';
  const si = document.getElementById('order-search');
  if(si) si.value = '';
  const sc = document.getElementById('search-clear');
  if(sc) sc.style.display = 'none';
  renderOrders();
}

function localSearchMatch(o, q) {
  const name = (o.userName || o.address?.name || '').toLowerCase();
  const email = (o.userEmail || '').toLowerCase();
  const phone = (o.userPhone || o.address?.phone || '').toLowerCase();
  const pid = (o.paymentId || '').toLowerCase();
  const oid = (o.orderId || o._id || '').toLowerCase();
  return name.includes(q) || email.includes(q) || phone.includes(q) || pid.includes(q) || oid.includes(q);
}

function renderOrders() {
  const grid = document.getElementById('orders-grid');
  let filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(o => localSearchMatch(o, q));
    // Merge in any cross-date Firestore results for this same query, deduped
    if (firestoreSearchResults.length && firestoreSearchQuery === searchQuery) {
      const seen = new Set(filtered.map(o => o._id));
      firestoreSearchResults.forEach(o => { if (!seen.has(o._id)) { filtered.push(o); seen.add(o._id); } });
    }
  }
  if (!filtered.length) {
    const msg = searchQuery ? (searchingFirestore ? 'Searching…' : 'No orders match your search') : (currentFilter === 'all' ? 'No orders today' : 'No orders in this category');
    const sub = searchQuery ? (searchingFirestore ? 'Looking across all dates in Firestore.' : 'Try a different name, email or order ID.') : (currentFilter === 'all' ? 'Orders placed today will appear here.' : 'Try a different filter.');
    grid.innerHTML = `<div class="empty-state"><h3>${msg}</h3><p>${sub}</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(o => renderOrderCard(o)).join('');
}

let searchDebounceTimer = null;
let firestoreSearchResults = [];
let firestoreSearchQuery = '';
let searchingFirestore = false;

function adminSearch(val) {
  searchQuery = val.trim();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  renderOrders();

  clearTimeout(searchDebounceTimer);
  if (!searchQuery) { firestoreSearchResults = []; firestoreSearchQuery = ''; return; }
  searchDebounceTimer = setTimeout(() => searchFirestoreForQuery(searchQuery), 500);
}

async function searchFirestoreForQuery(q) {
  // Only worth a Firestore round-trip if nothing local already matches (order might be on a different date)
  const localMatch = allOrders.some(o => localSearchMatch(o, q.toLowerCase()));
  if (localMatch) return;
  searchingFirestore = true;
  if (searchQuery === q) renderOrders();
  const results = [];
  const seen = new Set();
  for (const field of ['orderId', 'paymentId']) {
    try {
      const snap = await getDocs(query(collection(db, 'all_orders'), where(field, '==', q)));
      snap.docs.forEach(d => { if (!seen.has(d.id)) { seen.add(d.id); results.push({ _id: d.id, ...d.data() }); } });
    } catch (e) { console.error(`all_orders search by ${field} error:`, e); }
  }
  // Fallback: some orders never made it into all_orders (write failure at checkout).
  // A collection-group query finds the order under users/{uid}/orders regardless.
  if (!results.length) {
    for (const field of ['orderId', 'paymentId']) {
      try {
        const snap = await getDocs(query(collectionGroup(db, 'orders'), where(field, '==', q)));
        for (const d of snap.docs) {
          if (seen.has(d.id)) continue;
          seen.add(d.id);
          const data = d.data();
          // The local object's _id must match the all_orders doc ID (not the personal
          // subcollection's doc ID) since Mark Dispatched/Delivered updates all_orders by _id.
          const uidMatch = d.ref.path.match(/^users\/([^/]+)\/orders\//);
          const allOrdersDocId = data.orderId || d.id;
          const userPath = uidMatch ? `users/${uidMatch[1]}/orders` : null;
          results.push({ _id: allOrdersDocId, ...data, docId: d.id, userPath });
          // Backfill all_orders so future searches/date views pick it up without this fallback
          setDoc(doc(db, 'all_orders', allOrdersDocId), {
            ...data,
            docId: d.id,
            userPath
          }).catch(err => console.error('Backfill to all_orders failed:', err));
        }
      } catch (e) { console.error(`collectionGroup search by ${field} error:`, e); }
    }
  }
  firestoreSearchResults = results;
  firestoreSearchQuery = q;
  searchingFirestore = false;
  if (searchQuery === q) renderOrders();
}

function adminClearSearch() {
  searchQuery = '';
  firestoreSearchResults = [];
  firestoreSearchQuery = '';
  clearTimeout(searchDebounceTimer);
  document.getElementById('order-search').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderOrders();
}

function statusLabel(s) {
  return { confirmed: 'Pending', dispatched: 'Dispatched', delivered: 'Delivered', cancelled: 'Cancelled' }[s] || s;
}

function renderOrderCard(o) {
  const addr = o.address || {};
  const addrLine = [addr.addr1 || addr.line1, addr.addr2 || addr.line2, addr.city, addr.state, addr.pin || addr.pincode].filter(Boolean).join(', ');
  const itemsHtml = (o.items || []).map(i => `
    <div class="item-row">

      <span class="item-name">${i.name}${(() => { const pid=(window.getProductId&&window.getProductId(i.name))||i.productId||''; return pid?` <span style="font-size:.7rem;font-weight:600;color:#b5451b;background:#fff3ed;border-radius:5px;padding:2px 6px;">${pid}</span>`:''; })()}</span>
      <span class="item-qty">×${i.qty}</span>
      <span class="item-price">₹${(i.price * i.qty).toFixed(0)}</span>
    </div>`).join('');

  const time = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';
  const pid = o.orderId || o._id || '';
  const status = o.status || 'confirmed';
  const statusBadge = `<span class="status-badge status-${status}">${statusLabel(status)}</span>`;

  let actionBtns = '';
  if (status === 'confirmed') {
    actionBtns = `<button class="btn-status btn-dispatch" onclick="adminUpdateStatus('${o._id}','dispatched')">Mark Dispatched</button>
      <button class="btn-status btn-deliver" onclick="adminUpdateStatus('${o._id}','delivered')">Mark Delivered</button>`;
  } else if (status === 'dispatched') {
    actionBtns = `<button class="btn-status btn-deliver" onclick="adminUpdateStatus('${o._id}','delivered')">Mark Delivered</button>`;
  } else if (status === 'delivered') {
    actionBtns = `<button class="btn-status btn-delivered-done" disabled>✓ Delivered</button>`;
  }

  const customerName = o.userName || addr.name || '—';
  const customerPhone = o.userPhone || addr.phone || '—';

  return `
    <div class="order-card" id="card-${o._id}">
      <div class="order-card-head">
        <div class="order-meta">
          <span class="order-time">${time}</span>
          <span class="order-pid">${pid}</span>
          ${statusBadge}
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span class="order-total">₹${o.total || 0}</span>
          <div class="status-actions">${actionBtns}</div>
        </div>
      </div>
      <div class="order-card-body">
        <div class="order-items-col">
          <div class="col-title">Items Ordered</div>
          ${itemsHtml}
          <div style="padding-top:10px;font-size:13px;color:#888;border-top:1px solid #f0e6d3;margin-top:6px;">
            Subtotal ₹${o.subtotal || 0} · Shipping ₹${o.shipping || 0} · <strong style="color:#333;">Total ₹${o.total || 0}</strong>
          </div>
        </div>
        <div class="order-addr-col">
          <div class="col-title">Customer & Delivery</div>
          <div class="addr-name">${customerName}</div>
          <div class="addr-phone">📱 ${customerPhone}</div>
          ${o.userEmail ? `<div class="customer-email">✉ ${o.userEmail}</div>` : ''}
          <div class="addr-line" style="margin-top:10px;">📍 ${addrLine || '—'}</div>
        </div>
      </div>
    </div>`;
}

function setSection(s) {
  document.querySelectorAll('.section-tab').forEach(t => t.classList.toggle('active', t.dataset.section === s));

  document.getElementById('reviews-section').style.display = s === 'reviews' ? 'block' : 'none';
  document.getElementById('revenue-section').style.display = s === 'revenue' ? 'block' : 'none';
  document.getElementById('performance-section').style.display = s === 'performance' ? 'block' : 'none';
  if (s === 'queries' && !queriesLoaded) loadQueries();
  if (s === 'reviews' && !reviewsLoaded) loadReviews();
  if (s === 'revenue' && !revenueLoaded) { initRevenueDefaults(); loadRevenue(); }
  if (s === 'performance') loadPerformance();
}

function queryDateStr(q) {
  const dt = q.createdAt?.toDate ? q.createdAt.toDate() : null;
  if (!dt) return '';
  const ist = new Date(dt.getTime() + 5.5 * 60 * 60000);
  return ist.toISOString().slice(0, 10);
}

let queriesFilterMode = 'day';

function setQueriesFilterMode(mode) {
  queriesFilterMode = mode;
  document.querySelectorAll('#queries-section .filter-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('queries-day-picker-wrap').style.display = mode === 'day' ? 'flex' : 'none';
  document.getElementById('queries-month-picker-wrap').style.display = mode === 'month' ? 'flex' : 'none';
  document.getElementById('queries-year-picker-wrap').style.display = mode === 'year' ? 'flex' : 'none';
  const input = mode === 'day' ? document.getElementById('queries-date-picker')
              : mode === 'month' ? document.getElementById('queries-month-picker')
              : document.getElementById('queries-year-picker');
  setQueriesDateFilter(input.value);
}

  queriesDateFilter = val;
  document.getElementById('queries-clear-date-btn').style.display = val ? 'inline-flex' : 'none';

let queriesSearchQuery = '';
let queriesStatusFilter = 'all';

function setQueriesStatusFilter(val) {
  queriesStatusFilter = val;
  renderQueries();

function renderQueries() {
  const grid = document.getElementById('queries-grid');
  let filtered = queriesDateFilter ? allQueries.filter(q => queryDateStr(q).startsWith(queriesDateFilter)) : allQueries;
  if (queriesStatusFilter === 'resolved') {
    filtered = filtered.filter(q => q.status === 'resolved');
  } else if (queriesStatusFilter === 'open') {
    filtered = filtered.filter(q => q.status !== 'resolved');
  }
  if (queriesSearchQuery) {
    const sq = queriesSearchQuery.toLowerCase();
    filtered = filtered.filter(q => {
      const msg = (q.message || '').toLowerCase();
      const email = (q.email || '').toLowerCase();
      const mobile = (q.mobile || '').toLowerCase();
      return msg.includes(sq) || email.includes(sq) || mobile.includes(sq);
    });
  }
  if (!filtered.length) {
    const statusNote = queriesStatusFilter === 'resolved' ? 'resolved' : (queriesStatusFilter === 'open' ? 'unresolved' : '');
    const msg = queriesSearchQuery ? 'No queries match your search' : (queriesDateFilter ? 'No queries on this date' : (statusNote ? `No ${statusNote} queries` : 'No queries yet'));
    const sub = queriesSearchQuery ? 'Try a different message, email or phone number.' : (queriesDateFilter ? 'Try a different date.' : (statusNote ? 'Try a different status filter.' : 'Messages submitted via the Contact Us form will appear here.'));
    grid.innerHTML = `<div class="empty-state"><h3>${msg}</h3><p>${sub}</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(renderQueryCard).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderQueryCard(q) {
  const dt = q.createdAt?.toDate ? q.createdAt.toDate() : null;
  const dateStr = dt ? dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  const timeStr = dt ? dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
  const isResolved = q.status === 'resolved';
  const statusBadge = `<span class="query-badge${isResolved ? ' resolved' : ''}">${isResolved ? 'Resolved' : 'Open'}</span>`;
  const resolutionHtml = `
    <div class="query-resolution-wrap">
      <div class="query-resolution-label">Resolution</div>
      <textarea class="query-resolution-input" id="resolution-${q._id}" placeholder="What did you tell the customer?" rows="2">${escapeHtml(q.resolution || '')}</textarea>
      <div class="query-resolution-row">
        <button class="btn-resolve" id="resolve-btn-${q._id}" onclick="adminSaveResolution('${q._id}')">${isResolved ? 'Update' : 'Mark Resolved'}</button>
      </div>
    </div>`;
  return `
    <div class="query-card">
      <div class="query-card-head">
        <span class="query-name">${q.name || 'Unknown'}</span>
        <div style="display:flex;align-items:center;gap:10px;">
          ${statusBadge}
          <span class="query-time">${dateStr}${timeStr ? ' · ' + timeStr : ''}</span>
        </div>
      </div>
      <div class="query-contact">
        ${q.mobile ? `<span>📱 ${q.mobile}</span>` : ''}
        ${q.email ? `<span>✉ ${q.email}</span>` : ''}
      </div>
      <div class="query-message">${q.message || ''}</div>
      ${resolutionHtml}
    </div>`;
}

function reviewDateStr(r) {
  const dt = r.date?.toDate ? r.date.toDate() : null;
  if (!dt) return '';
  const ist = new Date(dt.getTime() + 5.5 * 60 * 60000);
  return ist.toISOString().slice(0, 10);
}

function setRevenueFilterMode(mode) {
  revenueFilterMode = mode;
  document.querySelectorAll('#revenue-section .filter-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('revenue-day-picker-wrap').style.display = mode === 'day' ? 'flex' : 'none';

  loadRevenue();

async function loadRevenue() {
  const statsWrap = document.getElementById('revenue-stats');
  const breakdown = document.getElementById('revenue-breakdown');
  breakdown.innerHTML = '<div class="spinner"></div>';

  let startDate, endDate;
  if (revenueFilterMode === 'day') {
    const date = document.getElementById('revenue-date-picker').value;
    if (!date) return;
    startDate = endDate = date;
  } else if (revenueFilterMode === 'month') {
    const month = document.getElementById('revenue-month-picker').value;
    if (!month) return;
    const [y, m] = month.split('-').map(Number);
    startDate = `${month}-01`;
    endDate = `${month}-${String(daysInMonth(y, m)).padStart(2, '0')}`;
  } else {
    const year = document.getElementById('revenue-year-picker').value;
    if (!year) return;
    startDate = `${year}-01-01`;
    endDate = `${year}-12-31`;
  }

  try {
    const q = (revenueFilterMode === 'day')
      ? query(collection(db, 'all_orders'), where('date', '==', startDate))
      : query(collection(db, 'all_orders'), where('date', '>=', startDate), where('date', '<=', endDate));
    const snap = await getDocs(q);
    const orders = snap.docs.map(d => d.data());
    revenueLoaded = true;
    document.getElementById('revenue-last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
    renderRevenue(orders);
  } catch (e) {
    const indexUrl = e.message.match(/https:\/\/\S+/)?.[0] || '';
    const indexLink = indexUrl ? `<br><br><a href="${indexUrl}" target="_blank" style="color:#b5451b;font-weight:500;">→ Click here to create the required Firestore index</a> (takes ~1 min)` : '';
    breakdown.innerHTML = `<div class="error-box">Error loading revenue: ${e.message.split('You can create')[0].trim()}${indexLink}</div>`;
  }
}

function renderRevenue(orders) {
  const cancelled = orders.filter(o => o.status === 'cancelled');
  const counted = orders.filter(o => o.status !== 'cancelled');
  const total = counted.reduce((s, o) => s + (o.total || 0), 0);
  const avg = counted.length ? total / counted.length : 0;

  document.getElementById('revenue-total').textContent = '₹' + total.toFixed(0);
  document.getElementById('revenue-order-count').textContent = counted.length;
  document.getElementById('revenue-avg').textContent = '₹' + avg.toFixed(0);
  document.getElementById('revenue-cancelled').textContent = cancelled.length;

  const breakdown = document.getElementById('revenue-breakdown');
  if (revenueFilterMode === 'day') {
    breakdown.innerHTML = '';
    return;
  }

  // Group by date for month/year view
  const byDate = {};
  counted.forEach(o => {
    const d = o.date || 'unknown';
    byDate[d] = (byDate[d] || 0) + (o.total || 0);
  });
  const dates = Object.keys(byDate).sort().reverse();
  if (!dates.length) {
    breakdown.innerHTML = `<div class="empty-state"><h3>No revenue in this period</h3><p>Try a different date range.</p></div>`;
    return;
  }
  const maxVal = Math.max(...Object.values(byDate));
  const rowsHtml = dates.map(d => {
    const amt = byDate[d];
    const count = counted.filter(o => o.date === d).length;
    const pct = maxVal ? Math.round((amt / maxVal) * 100) : 0;
    const label = new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: revenueFilterMode === 'year' ? undefined : 'numeric' });
    return `
      <div class="rev-row">
        <span class="rev-row-label">${label}<span class="rev-row-count">${count} order${count !== 1 ? 's' : ''}</span></span>
        <div class="rev-bar-wrap"><div class="rev-bar" style="width:${pct}%"></div></div>
        <span class="rev-row-amt">₹${amt.toFixed(0)}</span>
      </div>`;
  }).join('');
  breakdown.innerHTML = `<div class="rev-breakdown-card"><div class="rev-breakdown-title">Revenue by day</div>${rowsHtml}</div>`;
}

// Products get renamed over time (e.g. "Natural Baby Food Mix" -> "Natural Baby Starter Mix");
// old orders/reviews still use the name that was current when they were placed. Group those
// under today's catalog name instead of listing every historical name as a separate product.
const PRODUCT_NAME_ALIASES = {
  'Natural Baby Starter Mix': ['Natural Baby Food Mix'],
  'Natural Baby Growth Mix': ['Growth Mix'],
  'Natural Baby Millet Mix': ['Daily Millet Mix']
};

function resolveCanonicalProductName(name) {
  if (PRODUCT_NAME_ALIASES[name]) return name;
  for (const canonical in PRODUCT_NAME_ALIASES) {
    if (PRODUCT_NAME_ALIASES[canonical].includes(name)) return canonical;
  }
  return name;
}

function productMatchesSelection(itemName, selected) {
  if (itemName === selected) return true;
  return (PRODUCT_NAME_ALIASES[selected] || []).includes(itemName);
}

function populatePerformanceProductSelect() {
  const select = document.getElementById('performance-product-select');
  if (!select) return;
  const catalog = window.PRODUCT_CATALOG_ALL || window.PRODUCT_CATALOG;
  const set = new Set();
  if (catalog) {
    (Array.isArray(catalog) ? catalog : Object.values(catalog)).forEach(p => p.name && set.add(p.name));
  }
  // Historical orders/reviews may use older product names — fold those into their current name
  allOrdersFull.forEach(o => (o.items || []).forEach(i => i.name && set.add(resolveCanonicalProductName(i.name))));
  allReviews.forEach(r => r.productName && set.add(resolveCanonicalProductName(r.productName)));
  const names = Array.from(set).sort();
  const prevValue = select.value;
  select.innerHTML = names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if (names.includes(prevValue)) select.value = prevValue;
  else if (names.length) select.value = names[0];
  populatePerformanceYearSelect();
}

function populatePerformanceYearSelect() {
  const input = document.getElementById('performance-year-input');
  if (!input) return;
  if (!input.value) {
    const years = new Set();
    allOrdersFull.forEach(o => { if (o.date) years.add(Number(o.date.slice(0, 4))); });
    allReviews.forEach(r => { const d = reviewDateStr(r); if (d) years.add(Number(d.slice(0, 4))); });
    const nowYear = new Date().getFullYear();
    years.add(nowYear);
    const sortedYears = Array.from(years).sort((a, b) => a - b);
    // Pad the range so the spinner has somewhere to go even when all data
    // falls in a single year (min===max would make the arrows do nothing).
    input.min = sortedYears[0] - 2;
    input.max = 2050;
  }
  if (!input.dataset.bound) {
    input.dataset.bound = '1';
    input.addEventListener('change', () => {
      document.getElementById('performance-clear-year-btn').style.display = input.value ? 'inline-flex' : 'none';
      renderPerformance();
    });
  }
  renderPerformance();
}

function clearPerformanceYear() {

}

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
}

function renderPerfChart(title, months, valuesByMonth, countsByMonth, formatFn, barClass, totalLabel) {
  const isRating = barClass === 'rating';
  const chronological = [...months].reverse();
  const maxVal = isRating ? 5 : Math.max(...chronological.map(m => valuesByMonth[m] || 0), 1);
  const cols = chronological.map(m => {
    if (isRating && !countsByMonth[m]) return '';
    const val = isRating ? (valuesByMonth[m] / countsByMonth[m]) : (valuesByMonth[m] || 0);
    const pct = Math.max(Math.round((val / maxVal) * 100), 4);
    const displayVal = formatFn(val);
    const sub = isRating ? `<span class="vbar-sub">${countsByMonth[m]} review${countsByMonth[m] !== 1 ? 's' : ''}</span>` : '';
    return `
      <div class="vbar-col">
        <span class="vbar-val">${displayVal}</span>
        <div class="vbar-track"><div class="vbar-fill ${barClass || 'revenue'}" style="height:${pct}%"></div></div>
        <span class="vbar-label">${monthLabel(m)}${sub}</span>
      </div>`;
  }).filter(Boolean).join('');
  if (!cols) return '';

  let totalVal, totalSub = '';
  if (isRating) {
    const sumRatings = chronological.reduce((s, m) => s + (valuesByMonth[m] || 0), 0);
    const sumCounts = chronological.reduce((s, m) => s + (countsByMonth[m] || 0), 0);
    totalVal = formatFn(sumCounts ? sumRatings / sumCounts : 0);
    totalSub = `${sumCounts} review${sumCounts !== 1 ? 's' : ''} total`;
  } else {
    const sum = chronological.reduce((s, m) => s + (valuesByMonth[m] || 0), 0);
    totalVal = formatFn(sum);
  }
  const totalHtml = `
    <div class="perf-total">
      <span class="perf-total-label">${totalLabel}${totalSub ? ' (' + totalSub + ')' : ''}</span>
      <span class="perf-total-val ${barClass || 'revenue'}">${totalVal}</span>
    </div>`;

  return `<div class="perf-chart"><div class="perf-chart-title">${title}</div><div class="vbar-chart">${cols}</div>${totalHtml}</div>`;
}

function renderMergedPerfChart(months, revenueByMonth, unitsByMonth, ratingSumByMonth, ratingCountByMonth, ordersByMonth) {
  const chronological = [...months].reverse();
  const maxRevenue = Math.max(...chronological.map(m => revenueByMonth[m] || 0), 1);
  const maxUnits = Math.max(...chronological.map(m => unitsByMonth[m] || 0), 1);
  const maxRating = 5;

  const groups = chronological.map(m => {
    const revenue = revenueByMonth[m] || 0;
    const units = unitsByMonth[m] || 0;
    const orderCount = (ordersByMonth && ordersByMonth[m]) || 0;
    const ratingCount = ratingCountByMonth[m] || 0;
    const rating = ratingCount ? (ratingSumByMonth[m] / ratingCount) : 0;

    const revPct = Math.max(Math.round((revenue / maxRevenue) * 100), revenue ? 4 : 0);
    const unitsPct = Math.max(Math.round((units / maxUnits) * 100), units ? 4 : 0);
    const ratingPct = Math.max(Math.round((rating / maxRating) * 100), ratingCount ? 4 : 0);

    return `
      <div class="merged-month-group">
        <div class="merged-bars-row">
          <div class="merged-bar-col">
            <span class="merged-bar-val">₹${revenue.toFixed(0)}</span>
            <div class="merged-bar-track"><div class="merged-bar-fill revenue" style="height:${revPct}%"></div></div>
          </div>
          <div class="merged-bar-col">
            <span class="merged-bar-val">${units}</span>
            <div class="merged-bar-track"><div class="merged-bar-fill units" style="height:${unitsPct}%"></div></div>
          </div>
          <div class="merged-bar-col">
            <span class="merged-bar-val">${ratingCount ? '★' + rating.toFixed(1) : '—'}</span>
            <div class="merged-bar-track"><div class="merged-bar-fill rating" style="height:${ratingPct}%"></div></div>
          </div>
        </div>
        <div class="merged-month-label">${monthLabel(m)}</div>
        <div class="merged-month-summary">
          <div class="merged-summary-line">Revenue: <b>₹${revenue.toFixed(0)}</b></div>
          <div class="merged-summary-line">Orders: <b>${orderCount}</b></div>
          <div class="merged-summary-line">Rating: <b>${ratingCount ? '★' + rating.toFixed(1) : '—'}</b></div>
        </div>
      </div>`;
  }).join('');

  const totalRevenue = chronological.reduce((s, m) => s + (revenueByMonth[m] || 0), 0);
  const totalUnits = chronological.reduce((s, m) => s + (unitsByMonth[m] || 0), 0);
  const sumRatings = chronological.reduce((s, m) => s + (ratingSumByMonth[m] || 0), 0);
  const sumCounts = chronological.reduce((s, m) => s + (ratingCountByMonth[m] || 0), 0);
  const overallRating = sumCounts ? (sumRatings / sumCounts) : 0;

  const totalsHtml = `
    <div class="perf-total">
      <span class="perf-total-label">Total Revenue</span>
      <span class="perf-total-val revenue">₹${totalRevenue.toFixed(0)}</span>
    </div>
    <div class="perf-total">
      <span class="perf-total-label">Total Units Ordered</span>
      <span class="perf-total-val units">${totalUnits}</span>
    </div>
    <div class="perf-total">
      <span class="perf-total-label">Overall Average Rating${sumCounts ? ' (' + sumCounts + ' review' + (sumCounts !== 1 ? 's' : '') + ' total)' : ''}</span>
      <span class="perf-total-val rating">${sumCounts ? '★' + overallRating.toFixed(1) : '—'}</span>
    </div>`;

  return `<div class="perf-chart">
    <div class="perf-chart-title">Monthly Performance</div>
    <div class="merged-legend">
      <span class="legend-item"><span class="legend-dot revenue"></span>Revenue</span>
      <span class="legend-item"><span class="legend-dot units"></span>Units Ordered</span>
      <span class="legend-item"><span class="legend-dot rating"></span>Avg Rating</span>
    </div>
    <div class="merged-chart">${groups}</div>
    ${totalsHtml}
  </div>`;
}

function renderPerformance() {
  const select = document.getElementById('performance-product-select');
  const product = select ? select.value : '';
  performanceProduct = product;
  const content = document.getElementById('performance-content');
  if (!product) {
    content.innerHTML = `<div class="empty-state"><h3>No products found</h3><p>Place some orders or wait for the catalog to load.</p></div>`;
    return;
  }

  const yearInput = document.getElementById('performance-year-input');
  const selectedYear = (yearInput && yearInput.value) ? yearInput.value : 'all';

  const revenueByMonth = {};
  const unitsByMonth = {};
  const ordersByMonth = {};
  allOrdersFull.forEach(o => {
    if (o.status === 'cancelled') return;
    const ym = (o.date || '').slice(0, 7);
    if (!ym) return;
    if (selectedYear !== 'all' && !ym.startsWith(selectedYear)) return;
    let matched = false;
    (o.items || []).forEach(i => {
      if (!productMatchesSelection(i.name, product)) return;
      revenueByMonth[ym] = (revenueByMonth[ym] || 0) + (i.price || 0) * (i.qty || 0);
      unitsByMonth[ym] = (unitsByMonth[ym] || 0) + (i.qty || 0);
      matched = true;
    });
    if (matched) ordersByMonth[ym] = (ordersByMonth[ym] || 0) + 1;
  });

  const ratingSumByMonth = {};
  const ratingCountByMonth = {};
  allReviews.forEach(r => {
    if (!productMatchesSelection(r.productName, product)) return;
    const ym = reviewDateStr(r).slice(0, 7);
    if (!ym) return;
    if (selectedYear !== 'all' && !ym.startsWith(selectedYear)) return;
    ratingSumByMonth[ym] = (ratingSumByMonth[ym] || 0) + (r.rating || 0);
    ratingCountByMonth[ym] = (ratingCountByMonth[ym] || 0) + 1;
  });

  const allMonths = Array.from(new Set([
    ...Object.keys(revenueByMonth),
    ...Object.keys(unitsByMonth),
    ...Object.keys(ratingCountByMonth)
  ])).sort().reverse();

  if (!allMonths.length) {
    const yearNote = selectedYear !== 'all' ? ` in ${selectedYear}` : '';
    content.innerHTML = `<div class="empty-state"><h3>No data for this product${yearNote}</h3><p>Orders and reviews for "${escapeHtml(product)}" will appear here.</p></div>`;
    return;
  }

  const html = renderMergedPerfChart(allMonths, revenueByMonth, unitsByMonth, ratingSumByMonth, ratingCountByMonth, ordersByMonth);

  content.innerHTML = html || `<div class="empty-state"><h3>No data for this product yet</h3><p>Orders and reviews for "${escapeHtml(product)}" will appear here.</p></div>`;
}

async function saveResolution(docId) {
  const textarea = document.getElementById('resolution-' + docId);
  const resolution = textarea ? textarea.value.trim() : '';
  if (!resolution) { alert('Please enter a resolution before marking as resolved.'); return; }
  const btn = document.getElementById('resolve-btn-' + docId);
  const originalLabel = btn ? btn.textContent : 'Mark Resolved';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  try {
    await updateDoc(doc(db, 'customer_queries', docId), {
      resolution: resolution,
      status: 'resolved',
      resolvedAt: serverTimestamp()
    });
    const q = allQueries.find(x => x._id === docId);
    if (q) { q.resolution = resolution; q.status = 'resolved'; }
    renderQueries();
  } catch (e) {
    alert('Error saving resolution: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
  }
}

async function updateStatus(docId, newStatus) {
  try {
    await updateDoc(doc(db, 'all_orders', docId), { status: newStatus });

    // Update whichever in-memory list currently holds this order (date-scoped or search results)
    const o = allOrders.find(x => x._id === docId) || firestoreSearchResults.find(x => x._id === docId);
    if (o) o.status = newStatus;

    // userPath/docId may be missing on the in-memory object (e.g. orders found via
    // the collectionGroup search fallback never had them locally) — the freshly
    // updated all_orders doc is the reliable source, so read it back if needed.
    let userPath = o && o.userPath;
    let personalDocId = o && o.docId;
    let userEmail = o && o.userEmail;
    let userName = o && o.userName;
    let userPhone = o && (o.userPhone || o.address?.phone);
    let orderIdForEmail = o && (o.orderId || o._id);
    if (!userPath || !personalDocId || !userEmail || !userPhone) {
      const freshSnap = await getDoc(doc(db, 'all_orders', docId));
      const freshData = freshSnap.data();
      userPath = userPath || freshData?.userPath;
      personalDocId = personalDocId || freshData?.docId;
      userEmail = userEmail || freshData?.userEmail;
      userName = userName || freshData?.userName;
      userPhone = userPhone || freshData?.userPhone || freshData?.address?.phone;
      orderIdForEmail = orderIdForEmail || freshData?.orderId || docId;
    }
    if (userPath && personalDocId) {
      try { await updateDoc(doc(db, userPath, personalDocId), { status: newStatus }); }
      catch (e2) { console.error('Personal order copy sync failed:', e2); }
    }

    if (userEmail && (newStatus === 'dispatched' || newStatus === 'delivered')) {
      fetch(`${BACKEND_URL}/api/send-status-email`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, name: userName || '', orderId: orderIdForEmail, status: newStatus })
      }).catch(err => console.error('Status email failed:', err));
    }

    if (userPhone && (newStatus === 'dispatched' || newStatus === 'delivered')) {
      fetch(`${BACKEND_URL}/api/send-status-whatsapp`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: userPhone, orderId: orderIdForEmail, status: newStatus })
      }).catch(err => console.error('Status WhatsApp failed:', err));
    }

    updateStats();
    renderOrders();
  } catch (e) {
    alert('Error updating status: ' + e.message);
  }
}
