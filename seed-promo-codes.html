<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seed Promo Codes — Maathruthva</title>
  <style>
    body{font-family:sans-serif;max-width:500px;margin:60px auto;padding:0 20px;background:#f5f0e8;}
    h2{color:#b5451b;margin-bottom:8px;}
    p{color:#555;font-size:14px;margin-bottom:24px;}
    button{padding:12px 28px;background:#b5451b;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;}
    button:disabled{background:#ccc;cursor:not-allowed;}
    pre{background:#fff;border:1px solid #e0d8cc;border-radius:8px;padding:14px;font-size:13px;white-space:pre-wrap;margin-top:20px;}
  </style>
</head>
<body>
  <h2>Seed Promo Codes to Firestore</h2>
  <p>Click the button to create the 4 promo code documents in the <strong>promo_codes</strong> collection.</p>
  <button id="btn" onclick="seed()">Seed Promo Codes Now</button>
  <pre id="log">Waiting...</pre>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const app = initializeApp({
    apiKey: "AIzaSyBWhNCWiT-us4L_J5ihcCiniisX1Jy9SoU",
    authDomain: "maathruthva.firebaseapp.com",
    projectId: "maathruthva",
  });
  const db = getFirestore(app);

  const CODES = [
    { code: 'MTR5', percent: 5 },
    { code: 'MTR10', percent: 10 },
    { code: 'MTR15', percent: 15 },
    { code: 'MTR20', percent: 20 },
  ];

  window.seed = async function () {
    const btn = document.getElementById('btn');
    const log = document.getElementById('log');
    btn.disabled = true;
    log.textContent = 'Seeding promo codes...\n';
    try {
      for (const c of CODES) {
        await setDoc(doc(db, 'promo_codes', c.code), { code: c.code, percent: c.percent, active: true });
        log.textContent += `✅ ${c.code} — ${c.percent}% off\n`;
      }
      log.textContent += '\n✅ Done! You can close this page now.';
    } catch (e) {
      log.textContent += '\n❌ Error: ' + e.message;
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
