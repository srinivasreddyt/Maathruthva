<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Reports – Maathruthva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:#fff8f0;color:#333;min-height:100vh;}

    /* ── Header ── */
    header{background:#fff;border-bottom:1px solid #f0e6d3;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .nav-actions{display:flex;gap:12px;align-items:center;}
    .btn-back{background:none;border:1.5px solid #b5451b;color:#b5451b;padding:7px 18px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;text-decoration:none;}
    .btn-back:hover{background:#b5451b;color:#fff;}

    /* ── Page ── */
    .page{max-width:860px;margin:0 auto;padding:32px 20px 60px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:32px;color:#b5451b;margin-bottom:6px;}
    .page-sub{color:#888;font-size:14px;margin-bottom:32px;}

    /* ── States ── */
    .state-box{text-align:center;padding:80px 20px;}
    .state-box svg{width:64px;height:64px;opacity:.25;margin-bottom:16px;}
    .state-box h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:#555;margin-bottom:8px;}
    .state-box p{color:#999;font-size:14px;}

    /* ── Report cards ── */
    .reports-grid{display:flex;flex-direction:column;gap:14px;}
    .report-card{background:#fff;border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .report-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#b5451b,#e07a5f);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:22px;}
    .report-info{flex:1;min-width:0;}
    .report-title{font-size:15px;font-weight:600;color:#333;margin-bottom:4px;}
    .report-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:#999;}
    .report-badge{font-size:11px;color:#b5451b;background:#ffeee7;padding:2px 10px;border-radius:10px;font-weight:500;}
    .report-date{color:#999;}
    .btn-download{background:#b5451b;color:#fff;border:none;padding:9px 20px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
    .btn-download:hover{background:#9a3a17;}

    /* ── Loading spinner ── */
    .spinner{width:36px;height:36px;border:3px solid #f0e6d3;border-top-color:#b5451b;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Maathruthva page loader ── */
    #page-loader{position:fixed;inset:0;z-index:9999;background:#F7F2E7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease,visibility .6s ease;}
    #page-loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .loader-emblem-wrap{position:relative;width:120px;height:120px;}
    .loader-emblem{width:120px;height:120px;border-radius:50%;object-fit:contain;background:#FBF8F0;position:relative;z-index:2;animation:loaderPulse 1.8s ease-in-out infinite;}
    .loader-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;background:linear-gradient(white,white) padding-box,linear-gradient(135deg,#6B8C4A,#DCE7C4,#B8901A,#6B8C4A) border-box;animation:loaderSpin 2.4s linear infinite;}
    .loader-ring2{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(107,140,74,.25);animation:loaderSpin 3.6s linear infinite reverse;}
    .loader-shine{position:absolute;inset:0;border-radius:50%;z-index:3;background:conic-gradient(from 0deg,transparent 60%,rgba(255,255,255,.55) 80%,transparent 100%);animation:loaderSpin 1.8s linear infinite;}
    .loader-text{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:500;color:#4A6830;letter-spacing:.04em;animation:loaderFade 1.8s ease-in-out infinite;}
    .loader-dots{display:inline-flex;gap:4px;margin-left:2px;vertical-align:bottom;}
    .loader-dots span{width:5px;height:5px;border-radius:50%;background:#B8901A;animation:dotBounce 1.4s ease-in-out infinite;}
    .loader-dots span:nth-child(2){animation-delay:.2s;}
    .loader-dots span:nth-child(3){animation-delay:.4s;}
    .loader-tagline{font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#8A7A50;}
    @keyframes loaderPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(107,140,74,.25);}50%{transform:scale(1.04);box-shadow:0 0 0 14px rgba(107,140,74,0);}}
    @keyframes loaderSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes loaderFade{0%,100%{opacity:.6;}50%{opacity:1;}}
    @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-6px);opacity:1;}}
    @media(max-width:560px){.loader-emblem-wrap{width:96px;height:96px;}.loader-emblem{width:96px;height:96px;}.loader-text{font-size:1.3rem;}}

    .brand-lockup{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .brand-logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#FBF8F0;padding:2px;box-shadow:0 3px 10px -3px rgba(74,104,48,.45);flex-shrink:0;}
    .brand-wordmark{height:32px;width:auto;object-fit:contain;}

    @media(max-width:480px){
      .report-card{flex-wrap:wrap;padding:16px;}
      .btn-download{width:100%;justify-content:center;}
    }
  </style>
<script src="product-catalog.js"></script>
</head>
<body>

<!-- Maathruthva Page Loader -->
<div id="page-loader">
  <div class="loader-emblem-wrap">
    <div class="loader-ring"></div>
    <div class="loader-ring2"></div>
    <img class="loader-emblem" id="loader-emblem-img" src="" alt="Maathruthva">
    <div class="loader-shine"></div>
  </div>
  <div class="loader-text">Maathruthva<span class="loader-dots"><span></span><span></span><span></span></span></div>
  <div class="loader-tagline">Products of Mother Nature</div>
</div>
<script>
  (function(){
    var _t = setInterval(function(){
      var src = document.querySelector('img.brand-logo');
      if(src && src.src){ document.getElementById('loader-emblem-img').src = src.src; clearInterval(_t); }
    }, 50);
    setTimeout(function(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }, 3000);
  })();
</script>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <a class="brand-lockup" href="index.html">
        <img class="brand-logo" src="assets/img/c05170bd02.webp" alt="Maathruthva logo">
        <img class="brand-wordmark" src="assets/img/3b99c164f9.webp" alt="Maathruthva — Products of Mother Nature">
    </a>
  </div>
  <div class="nav-actions">
    <a class="btn-back" href="Food_Products.html">← Shop</a>
  </div>
</header>

<div class="page">
  <h1 class="page-title">Lab Reports</h1>
  <p class="page-sub" id="reports-sub">Every batch tested for purity and safety — view or download the reports below.</p>
  <div id="reports-container"><div class="spinner"></div></div>
</div>

<script>
  const PROJECT_ID = 'maathruthva';

  function fsVal(v) {
    if (!v) return undefined;
    if (v.stringValue  !== undefined) return v.stringValue;
    if (v.integerValue !== undefined) return Number(v.integerValue);
    if (v.doubleValue  !== undefined) return Number(v.doubleValue);
    if (v.booleanValue !== undefined) return v.booleanValue;
    if (v.timestampValue !== undefined) return v.timestampValue;
    return undefined;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Only plain https links are allowed (blocks javascript:/data: URLs even if a document is tampered with).
  function isHttpsUrl(u) {
    try { return new URL(u).protocol === 'https:'; } catch (e) { return false; }
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function hideLoader(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }

  async function loadReports() {
    const container = document.getElementById('reports-container');
    const sub = document.getElementById('reports-sub');
    try {
      const url = 'https://firestore.googleapis.com/v1/projects/' + PROJECT_ID + '/databases/(default)/documents/lab_reports';
      const res = await fetch(url);
      const data = await res.json();
      const docs = data.documents || [];

      const reports = docs.map(d => {
        const f = d.fields || {};
        return {
          id: d.name.split('/').pop(),
          title: fsVal(f.title) || 'Lab Report',
          productName: fsVal(f.productName) || '',
          date: fsVal(f.date) || '',
          fileUrl: fsVal(f.fileUrl) || '',
          labName: fsVal(f.labName) || ''
        };
      }).filter(r => isHttpsUrl(r.fileUrl));

      reports.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      if (!reports.length) {
        container.innerHTML = `
          <div class="state-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>
            <h3>No reports available yet</h3>
            <p>Our lab reports will appear here as soon as they're published.</p>
          </div>`;
        sub.textContent = '';
        hideLoader();
        return;
      }

      sub.textContent = `${reports.length} report${reports.length > 1 ? 's' : ''} available`;
      container.innerHTML = `<div class="reports-grid">${reports.map(r => `
        <div class="report-card">
          <div class="report-icon">📄</div>
          <div class="report-info">
            <div class="report-title">${escapeHtml(r.title)}</div>
            <div class="report-meta">
              ${r.productName ? `<span class="report-badge">${escapeHtml(r.productName)}</span>` : ''}
              ${r.labName ? `<span>${escapeHtml(r.labName)}</span>` : ''}
              ${r.date ? `<span class="report-date">${escapeHtml(formatDate(r.date))}</span>` : ''}
            </div>
          </div>
          <a class="btn-download" href="${escapeHtml(r.fileUrl)}" target="_blank" rel="noopener noreferrer" download>⬇ Download</a>
        </div>`).join('')}</div>`;
      hideLoader();
    } catch (e) {
      console.error('Load reports error:', e);
      container.innerHTML = `
        <div class="state-box">
          <h3>Couldn't load reports</h3>
          <p>Please try again in a moment.</p>
        </div>`;
      sub.textContent = '';
      hideLoader();
    }
  }

  loadReports();
</script>

</body>
</html>
