  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Jost',sans-serif;background:#fff8f0;color:#333;min-height:100vh;}

    /* ── Header ── */
    header{background:#fff;border-bottom:1px solid #f0e6d3;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:#b5451b;text-decoration:none;font-weight:600;}
    .nav-actions{display:flex;gap:12px;align-items:center;}
    .btn-back{background:none;border:1.5px solid #b5451b;color:#b5451b;padding:7px 18px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;text-decoration:none;}
    .btn-back:hover{background:#b5451b;color:#fff;}

    /* ── Page ── */
    .page{max-width:860px;margin:0 auto;padding:32px 20px 60px;}
    .page-title{font-family:'Cormorant Garamond',serif;font-size:32px;color:#b5451b;margin-bottom:6px;}
    .page-sub{color:#888;font-size:14px;margin-bottom:32px;}

    /* ── States ── */
    .state-box{text-align:center;padding:80px 20px;}
    .state-box svg{width:64px;height:64px;opacity:.25;margin-bottom:16px;}
    .state-box h3{font-family:'Cormorant Garamond',serif;font-size:24px;color:#555;margin-bottom:8px;}
    .state-box p{color:#999;font-size:14px;margin-bottom:20px;}
    .btn-shop{background:#b5451b;color:#fff;border:none;padding:12px 28px;border-radius:24px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;}
    .btn-shop:hover{background:#9a3a17;}

    /* ── Order Card ── */
    .order-card{background:#fff;border-radius:14px;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);}
    .order-header{background:#fff8f0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #f0e6d3;}
    .order-meta{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
    .order-date{font-size:13px;color:#888;}
    .order-id{font-size:12px;color:#b5451b;background:#ffeee7;padding:3px 10px;border-radius:10px;font-weight:500;}
    .order-status{font-size:12px;padding:3px 12px;border-radius:10px;font-weight:500;}
    .status-confirmed{background:#e8f5e9;color:#2e7d32;}
    .order-total{font-size:15px;font-weight:600;color:#333;}

    /* ── Items ── */
    .order-items{padding:16px 20px;}
    .order-item{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #f9f0e8;}
    .order-item:last-child{border-bottom:none;}
    .item-img{width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#f0e6d3;}
    .item-img img{width:100%;height:100%;object-fit:cover;}
    .item-img-placeholder{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#b5451b,#e07a5f);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:20px;font-weight:700;font-family:'Cormorant Garamond',serif;}
    .item-info{flex:1;}
    .item-name{font-weight:500;font-size:14px;color:#333;margin-bottom:3px;}
    .item-meta{font-size:12px;color:#999;}
    .item-price{font-size:14px;color:#b5451b;font-weight:600;text-align:right;}

    /* ── Receipt ── */
    .order-btn-group{display:flex;align-items:center;gap:10px;flex-shrink:0;}
    .btn-receipt{background:none;border:1.5px solid #b5451b;color:#b5451b;padding:7px 18px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent;outline:none;}
    .btn-receipt:hover{background:#b5451b;color:#fff;}
    .btn-receipt:focus,.btn-receipt:active{outline:none;background:none;}
    .receipt-icon{width:16px;height:16px;flex-shrink:0;}
    .receipt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
    .receipt-overlay.open{display:flex;}
    .receipt-modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:28px 26px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.2);}
    .receipt-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:#999;cursor:pointer;line-height:1;}
    .receipt-close:hover{color:#333;}
    .receipt-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:#b5451b;margin-bottom:4px;}
    .receipt-sub{font-size:12px;color:#999;margin-bottom:20px;}
    .receipt-row{display:flex;justify-content:space-between;font-size:14px;color:#555;padding:7px 0;}
    .receipt-row.total{border-top:1.5px solid #f0e6d3;margin-top:6px;padding-top:12px;font-size:16px;font-weight:600;color:#333;}
    .receipt-row .neg{color:#2e7d32;}
    .receipt-promo{font-size:11px;color:#b5451b;background:#ffeee7;padding:2px 8px;border-radius:8px;margin-left:6px;}

    /* ── Address ── */
    .order-address{padding:12px 20px 16px;background:#fafafa;border-top:1px solid #f0e6d3;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .address-block{flex:1;}
    .address-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
    .address-text{font-size:13px;color:#666;}
    .btn-track{background:#b5451b;color:#fff;border:none;padding:9px 20px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .btn-track:hover{background:#9a3a17;}

    /* ── Review section ── */
    .order-review{padding:14px 20px 18px;background:#fffaf3;border-top:1px solid #f0e6d3;}
    .review-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
    .star-rating{display:flex;gap:4px;align-items:center;}
    .star-rating .star{font-size:26px;cursor:pointer;color:#ddd;transition:color .15s;user-select:none;}
    .star-rating .star.filled{color:#f5a623;}
    .star-rating.readonly .star{cursor:default;}
    .review-submit-row{display:flex;align-items:center;gap:14px;margin-top:10px;}
    .btn-review-submit{background:#b5451b;color:#fff;border:none;padding:8px 20px;border-radius:20px;font-family:'Jost',sans-serif;font-size:13px;cursor:pointer;}
    .btn-review-submit:hover{background:#9a3a17;}
    .btn-review-submit:disabled{background:#ccc;cursor:not-allowed;}
    .review-submitted-note{font-size:13px;color:#2e7d32;display:flex;align-items:center;gap:8px;}
    .review-comment-input{width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid #e8dfd0;border-radius:10px;font-family:'Jost',sans-serif;font-size:13px;color:#333;resize:vertical;outline:none;}
    .review-comment-input:focus{border-color:#b5451b;}
    .review-comment-text{font-size:13px;color:#666;font-style:italic;margin-top:8px;padding-left:2px;}

    /* ── Loading spinner (inline orders list) ── */
    .spinner{width:36px;height:36px;border:3px solid #f0e6d3;border-top-color:#b5451b;border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Maathruthva page loader ── */
    #page-loader{position:fixed;inset:0;z-index:9999;background:#F7F2E7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s ease,visibility .6s ease;}
    #page-loader.hidden{opacity:0;visibility:hidden;pointer-events:none;}
    .loader-emblem-wrap{position:relative;width:120px;height:120px;}
    .loader-emblem{width:120px;height:120px;border-radius:50%;object-fit:contain;background:#FBF8F0;position:relative;z-index:2;animation:loaderPulse 1.8s ease-in-out infinite;}
    .loader-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;background:linear-gradient(white,white) padding-box,linear-gradient(135deg,#6B8C4A,#DCE7C4,#B8901A,#6B8C4A) border-box;animation:loaderSpin 2.4s linear infinite;}
    .loader-ring2{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(107,140,74,.25);animation:loaderSpin 3.6s linear infinite reverse;}
    .loader-shine{position:absolute;inset:0;border-radius:50%;z-index:3;background:conic-gradient(from 0deg,transparent 60%,rgba(255,255,255,.55) 80%,transparent 100%);animation:loaderSpin 1.8s linear infinite;}
    .loader-text{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:500;color:#4A6830;letter-spacing:.04em;animation:loaderFade 1.8s ease-in-out infinite;}
    .loader-dots{display:inline-flex;gap:4px;margin-left:2px;vertical-align:bottom;}
    .loader-dots span{width:5px;height:5px;border-radius:50%;background:#B8901A;animation:dotBounce 1.4s ease-in-out infinite;}
    .loader-dots span:nth-child(2){animation-delay:.2s;}
    .loader-dots span:nth-child(3){animation-delay:.4s;}
    .loader-tagline{font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#8A7A50;}
    @keyframes loaderPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(107,140,74,.25);}50%{transform:scale(1.04);box-shadow:0 0 0 14px rgba(107,140,74,0);}}
    @keyframes loaderSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes loaderFade{0%,100%{opacity:.6;}50%{opacity:1;}}
    @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-6px);opacity:1;}}
    @media(max-width:560px){.loader-emblem-wrap{width:96px;height:96px;}.loader-emblem{width:96px;height:96px;}.loader-text{font-size:1.3rem;}}

    @media(max-width:480px){
      .order-header{flex-direction:column;align-items:flex-start;}
      .item-img,.item-img-placeholder{width:52px;height:52px;}
      .btn-receipt{padding:0;width:38px;height:38px;border-radius:50%;justify-content:center;border-width:1.8px;}
      .btn-receipt .btn-label{display:none;}
      .receipt-icon{width:19px;height:19px;}
    }
  
    .brand-lockup{display:flex;align-items:center;gap:10px;text-decoration:none;}
      .brand-logo{width:44px;height:44px;border-radius:50%;object-fit:contain;background:#FBF8F0;padding:2px;box-shadow:0 3px 10px -3px rgba(74,104,48,.45);flex-shrink:0;}
      .brand-wordmark{height:32px;width:auto;object-fit:contain;}
  </style>
<script src="product-catalog.js"></script>
</head>

</script>

<script type="module">
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query, addDoc, doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBWhNCWiT-us4L_J5ihcCiniisX1Jy9SoU",
    authDomain: "maathruthva.firebaseapp.com",
    projectId: "maathruthva",
    storageBucket: "maathruthva.firebasestorage.app",
    messagingSenderId: "772318181453",
    appId: "1:772318181453:web:e736b87f53c264b8cf8404"
  };

  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Ids are interpolated into inline onclick handlers, where HTML-escaping alone is not enough.
  function safeId(s) {
    return /^[A-Za-z0-9_-]{1,128}$/.test(String(s)) ? String(s) : '';
  }

  const container = document.getElementById('orders-container');
  const sub = document.getElementById('orders-sub');

  // Check Firebase Auth state — if session expired, clear localStorage and treat as logged out
  onAuthStateChanged(auth, (firebaseUser) => {
    const stored = JSON.parse(localStorage.getItem('mtr_user') || 'null');
    if (!firebaseUser && stored && stored.loggedIn && !stored.guest) {
      // Firebase session expired — clear local session
      localStorage.removeItem('mtr_user');
      localStorage.removeItem('mtr_addresses');
    }
    loadOrders();
  });

  function hideLoader(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }

  async function loadOrders() {
  const user = JSON.parse(localStorage.getItem('mtr_user') || 'null');
  if (!user || !user.uid || user.guest) {
    container.innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 11c0 2.21-1.79 4-4 4s-4-1.79-4-4 1.79-4 4-4 4 1.79 4 4zm6 8c0-3.31-4.03-6-9-6s-9 2.69-9 6"/></svg>
        <h3>Please log in</h3>
        <p>You need to be logged in to view your orders.</p>
        <button class="btn-shop" onclick="location.href='login.html?next=my-orders.html'">Log In</button>
      </div>`;
    sub.textContent = '';
    hideLoader();
    return;
  }

  // Build image map from product-data.js
  const imgMap = {};
  if (window.PRODUCT_DATA) {
    // Keyed by product id (survives renames in the catalog) and by the old name (orders placed before ids were stored).
    window.PRODUCT_DATA.forEach(p => { const e = { img: p.img, imgClass: p.imgClass }; imgMap[p.name] = e; imgMap['FP0' + p.id] = e; });
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts.seconds ? ts.seconds * 1000 : ts);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  }

  function renderItemImg(item) {
    const itemName = item.name;
    const prod = imgMap[item.productId] || imgMap[itemName];
    if (prod && prod.img) {
      return `<div class="item-img"><img src="${prod.img}" alt="${escapeHtml(itemName)}"></div>`;
    }
    return `<div class="item-img-placeholder">${escapeHtml(getInitials(itemName))}</div>`;
  }

  function renderAddress(addr) {
    if (!addr) return '';
    const parts = [addr.addr1 || addr.line1, addr.addr2 || addr.line2, addr.city, addr.state, addr.pin || addr.pincode].filter(Boolean);
    return parts.join(', ');
  }

  const ordersDataMap = {};

  function renderOrder(id, data) {
    ordersDataMap[id] = data;
    const items = data.items || [];
    const itemsHtml = items.map(item => `
      <div class="order-item">
        ${renderItemImg(item)}
        <div class="item-info">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-meta">Qty: ${escapeHtml(Number(item.qty) || 0)} &nbsp;·&nbsp; ₹${escapeHtml(Number(item.price) || 0)} each</div>
        </div>
        <div class="item-price">₹${escapeHtml(((Number(item.price) || 0) * (Number(item.qty) || 0)).toFixed(0))}</div>
      </div>`).join('');

    const addrText = renderAddress(data.address);
    const productNames = items.map(i => i.name).join(', ');
    const isDelivered = (data.status || '').toLowerCase() === 'delivered';
    const reviewHtml = isDelivered ? renderReviewSection(id, data, productNames) : '';

    return `
      <div class="order-card">
        <div class="order-header">
          <div class="order-meta">
            <span class="order-date">${formatDate(data.createdAt)}</span>
            <span class="order-id">Order ID: ${escapeHtml(data.orderId || id)}</span>
            <span class="order-status status-confirmed">${escapeHtml(data.status || 'Confirmed')}</span>
          </div>
          <div class="order-total">₹${escapeHtml(Number(data.total) || 0)}</div>
        </div>
        <div class="order-items">${itemsHtml}</div>
        <div class="order-address">
          ${addrText ? `<div class="address-block"><div class="address-label">Delivery Address</div><div class="address-text">${escapeHtml(addrText)}</div></div>` : '<div class="address-block"></div>'}
          <div class="order-btn-group">
            <button class="btn-receipt" onclick="showReceipt('${safeId(id)}')"><svg class="receipt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21V3a1 1 0 0 1 1-1z"/><line x1="8.5" y1="7" x2="15.5" y2="7"/><line x1="8.5" y1="11" x2="15.5" y2="11"/><line x1="8.5" y1="15" x2="12.5" y2="15"/></svg><span class="btn-label">Receipt</span></button>
            ${isDelivered ? '' : `<button class="btn-track" onclick="showTracking('${safeId(id)}')">Track Order</button>`}
          </div>
        </div>
        ${reviewHtml}
      </div>`;
  }

  window.showTracking = function(id) {
    const data = ordersDataMap[id];
    if (!data) return;
    alert('Tracking ID: ' + (data.paymentId || id));
  };

  window.showReceipt = function(id) {
    const data = ordersDataMap[id];
    if (!data) return;
    const items = data.items || [];
    const num = v => Number(v) || 0;
    const subtotal = num(data.subtotal != null ? data.subtotal : items.reduce((s, i) => s + num(i.price) * num(i.qty), 0));
    const discount = num(data.discount);
    const shipping = num(data.shipping);
    const total = num(data.total != null ? data.total : (subtotal - discount + shipping));
    const promoTag = data.promoCode ? `<span class="receipt-promo">${escapeHtml(data.promoCode)}</span>` : '';

    const itemRows = items.map(item => `
      <div class="receipt-row"><span>${escapeHtml(item.name)} × ${escapeHtml(num(item.qty))}</span><span>₹${escapeHtml((num(item.price) * num(item.qty)).toFixed(0))}</span></div>`).join('');

    document.getElementById('receipt-order-id').textContent = `Order ID: ${data.orderId || id} · ${formatDate(data.createdAt)}`;
    document.getElementById('receipt-body').innerHTML = `
      ${itemRows}
      <div class="receipt-row" style="border-top:1px solid #f0e6d3;margin-top:8px;padding-top:10px;"><span>Subtotal</span><span>₹${subtotal}</span></div>
      <div class="receipt-row"><span>Discount${promoTag}</span><span class="neg">${discount > 0 ? '−₹' + discount : '₹0'}</span></div>
      <div class="receipt-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : '₹' + shipping}</span></div>
      <div class="receipt-row total"><span>Total Paid</span><span>₹${total}</span></div>`;
    document.getElementById('receipt-overlay').classList.add('open');
  };

  window.closeReceipt = function() {
    document.getElementById('receipt-overlay').classList.remove('open');
  };

  function renderReviewSection(id, data, productNames) {
    if (data.reviewSubmitted) {
      const r = data.reviewRating || 0;
      const stars = [1,2,3,4,5].map(n => `<span class="star${n <= r ? ' filled' : ''}">★</span>`).join('');
      const comment = data.reviewComment ? `<div class="review-comment-text">"${escapeHtml(data.reviewComment)}"</div>` : '';
      return `
        <div class="order-review">
          <div class="review-label">Your Review</div>
          <div class="review-submitted-note"><span class="star-rating readonly">${stars}</span> Thanks for rating this order!</div>
          ${comment}
        </div>`;
    }
    const sid = safeId(id);
    if (!sid) return '';
    return `
      <div class="order-review">
        <div class="review-label">Rate this order</div>
        <div class="star-rating" id="stars-${sid}" data-rating="0">
          ${[1,2,3,4,5].map(n => `<span class="star" data-value="${n}" onclick="setOrderRating('${sid}',${n})">★</span>`).join('')}
        </div>
        <textarea class="review-comment-input" id="comment-${sid}" placeholder="Share your experience (optional)" rows="2"></textarea>
        <div class="review-submit-row">
          <button class="btn-review-submit" id="submit-btn-${sid}" disabled onclick="submitOrderReview('${sid}', ${escapeHtml(JSON.stringify(productNames))})">Submit Review</button>
        </div>
      </div>`;
  }

  try {
    const q = query(collection(db, 'users', user.uid, 'orders'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      container.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>
          <h3>No orders yet</h3>
          <p>Your completed orders will appear here.</p>
          <button class="btn-shop" onclick="location.href='Food_Products.html'">Start Shopping</button>
        </div>`;
      sub.textContent = '';
      hideLoader();
      return;
    }

    const count = snap.size;
    sub.textContent = `${count} order${count > 1 ? 's' : ''} found`;
    container.innerHTML = snap.docs.map(doc => renderOrder(doc.id, doc.data())).join('');
    hideLoader();
  } catch(e) {
    console.error('Orders fetch error:', e);
    container.innerHTML = `<div class="state-box"><h3>Something went wrong</h3><p>${e.message}</p></div>`;
    sub.textContent = '';
    hideLoader();
  }
  } // end loadOrders

  window.setOrderRating = function(orderId, value) {
    const wrap = document.getElementById('stars-' + orderId);
    if (!wrap) return;
    wrap.dataset.rating = value;
    wrap.querySelectorAll('.star').forEach(s => {
      s.classList.toggle('filled', Number(s.dataset.value) <= value);
    });
    const btn = document.getElementById('submit-btn-' + orderId);
    if (btn) btn.disabled = false;
  };

  window.submitOrderReview = async function(orderId, productNames) {
    const wrap = document.getElementById('stars-' + orderId);
    const rating = wrap ? Number(wrap.dataset.rating) : 0;
    if (!rating) return;
    const commentEl = document.getElementById('comment-' + orderId);
    const comment = commentEl ? commentEl.value.trim() : '';
    const btn = document.getElementById('submit-btn-' + orderId);
    const user = JSON.parse(localStorage.getItem('mtr_user') || 'null');
    if (!user || !user.uid) return;
    if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }
    try {
      await addDoc(collection(db, 'reviews'), {
        orderId: orderId,
        productName: productNames,
        rating: rating,
        comment: comment || null,
        email: user.email || null,
        phone: user.phone || null,
        uid: user.uid,
        date: serverTimestamp()
      });
      await updateDoc(doc(db, 'users', user.uid, 'orders', orderId), {
        reviewSubmitted: true,
        reviewRating: rating,
        reviewComment: comment || null
      });
      const card = wrap.closest('.order-review');
      if (card) {
        const stars = [1,2,3,4,5].map(n => `<span class="star${n <= rating ? ' filled' : ''}">★</span>`).join('');
        const commentHtml = comment ? `<div class="review-comment-text">"${escapeHtml(comment)}"</div>` : '';
        card.innerHTML = `<div class="review-label">Your Review</div><div class="review-submitted-note"><span class="star-rating readonly">${stars}</span> Thanks for rating this order!</div>${commentHtml}`;
      }
    } catch (e) {
      alert('Could not submit review: ' + e.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Submit Review'; }
    }
  };

  loadOrders();
</script>

<script src="chatbot.js"></script>
</body>
</html>
